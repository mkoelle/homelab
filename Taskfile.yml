---
# https://taskfile.dev
version: '3'

vars:
  # Colors
  RED: \033[31m
  GREEN: \033[1;32m
  RESET: \033[0m
  # Directories
  APPS_DIR: apps
  BUILD_DIR: .build
  # Docker images — pinned to specific versions; Renovate manages updates.
  CSPELL_IMAGE: ghcr.io/streetsidesoftware/cspell:v10.0.1
  MARKDOWNLINT_IMAGE: davidanson/markdownlint-cli2:v0.22.1
  KUBE_LINTER_IMAGE: stackrox/kube-linter:v0.8.3
  PLUTO_IMAGE: us-docker.pkg.dev/fairwinds-ops/oss/pluto:v5.24.0
  POLARIS_IMAGE: us-docker.pkg.dev/fairwinds-ops/oss/polaris:v10.2.0
  PRETTIER_IMAGE: tmknom/prettier:v0.22.1
  K8S_IMAGE: alpine/k8s:1.36.2
  # Computed
  KUSTOMIZATION_DIRS:
    sh: |
      if [ "$OS" = "Windows_NT" ]; then
        powershell -Command 'Get-ChildItem . -Recurse -Include kustomization.yaml,kustomization.yml `
          | ForEach-Object { [System.IO.Path]::GetDirectoryName($_.FullName) }'
      else
        find . -type f \( -name "kustomization.yaml" -o -name "kustomization.yml" \) -exec dirname {} \;
      fi
  CONTAINER_ENGINE:
    sh: |
      if command -v podman >/dev/null 2>&1; then
        echo "podman"
      else
        echo "docker"
      fi

tasks:
  default:
    desc: Show available tasks
    cmds: [task --list]
  all:
    cmds:
      - task: spell-check
      - task: lint
      - task: build
      - task: validate
      - cmd: printf "\n{{.GREEN}}✨ All validations passed!{{.RESET}}"
        silent: true
  lint:
    desc: Run linters
    silent: true
    cmds:
      - task: md-lint
      - task: md-fix
      - task: yaml-lint
  build:
    desc: Build all resources
    silent: true
    cmds:
      - task: check-placeholders
      - task: kustomize-build
  validate:
    desc: Validate all resources
    aliases: [valid]
    silent: true
    cmds:
      - task: validate-schema
      - task: kube-lint
      - task: deprecation-check
      - task: polaris
  clean:
    desc: Clean up build directory
    silent: true
    cmds:
      - task: remove-build-dirs
  spell-check:
    aliases: [spell]
    silent: true
    deps: [check-docker]
    desc: Run spell check
    cmds:
      - printf "\n{{.GREEN}}✅ Running spell check...{{.RESET}}\n"
      - |
        {{.CONTAINER_ENGINE}} run --rm -v "{{.ROOT_DIR}}:/work" -w /work \
        {{.CSPELL_IMAGE}} \
        --no-progress --color
  # Internal tasks
  check-placeholders:
    desc: Fail if placeholder UUIDs remain in manifests
    internal: true
    silent: true
    cmds:
      - |
        if grep -rq 'REPLACE-WITH' apps/; then
          printf "{{.RED}}❌ Placeholder UUIDs found — replace before applying:{{.RESET}}\n"
          grep -rn 'REPLACE-WITH' apps/
          exit 1
        fi
        printf "✅ No placeholder UUIDs found\n"
  check-docker:
    desc: Check if Docker is running
    internal: true
    silent: true
    run: once
    cmds:
      - |
        {{.CONTAINER_ENGINE}} info > /dev/null 2>&1 || {
          printf "\n{{.RED}}❌ {{.CONTAINER_ENGINE}} is not running. Please start {{.CONTAINER_ENGINE}}.{{.RESET}}\n"
          exit 1
        }
  md-fix:
    internal: true
    silent: true
    deps: [check-docker]
    desc: Fix Markdown files
    cmds:
      - printf "\n{{.GREEN}}✅ Fixing markdown files...{{.RESET}}\n"
      - |
        {{.CONTAINER_ENGINE}} run --rm -v "{{.ROOT_DIR}}:/work" -w /work \
        --user 0 \
        {{.MARKDOWNLINT_IMAGE}} \
        '**/*.md' \
        --fix
  yaml-lint:
    internal: true
    silent: true
    deps: [check-docker]
    desc: Lint YAML files
    cmds:
      - printf "\n{{.GREEN}}📝 Checking YAML syntax...{{.RESET}}\n"
      - |
        {{.CONTAINER_ENGINE}} run --rm -v "{{.ROOT_DIR}}:/work" -w /work \
        --user 0 \
        {{.PRETTIER_IMAGE}} \
        --write --parser=yaml **/*.yaml
  md-lint:
    internal: true
    silent: true
    deps: [check-docker]
    desc: Lint Markdown files
    cmds:
      - printf "\n{{.GREEN}}📝 Checking markdown syntax...{{.RESET}}\n"
      - |
        {{.CONTAINER_ENGINE}} run --rm -v "{{.ROOT_DIR}}:/work" -w /work \
        --user 0 \
        {{.PRETTIER_IMAGE}} \
        --write --parser=markdown /work/**/*.md
  create-build-dirs:
    desc: Create build directory
    internal: true
    silent: true
    run: once
    cmds:
      - for:
          var: KUSTOMIZATION_DIRS
        cmd: |
          if [ "$OS" = "Windows_NT" ]; then
            powershell -Command 'New-Item -Path "{{.ITEM}}/{{.BUILD_DIR}}" -ItemType Directory -Force' > /dev/null 2>&1
          else
            mkdir -p "{{.ITEM}}/{{.BUILD_DIR}}" > /dev/null 2>&1
          fi
  remove-build-dirs:
    desc: Remove build directory
    internal: true
    silent: true
    cmds:
      - for:
          var: KUSTOMIZATION_DIRS
        cmd: |
          if [ "$OS" = "Windows_NT" ]; then
            powershell -Command 'Remove-Item -Path "{{.ITEM}}/{{.BUILD_DIR}}" -Recurse -Force' > /dev/null 2>&1
          else
            rm -rf "{{.ITEM}}/{{.BUILD_DIR}}" > /dev/null 2>&1
          fi
  kustomize-build:
    desc: Build all kustomizations to verify syntax
    internal: true
    silent: true
    run: once
    deps: [check-docker, create-build-dirs]
    cmds:
      - printf "\n{{.GREEN}}🔨 Building kustomizations...{{.RESET}}\n"
      - for:
          var: KUSTOMIZATION_DIRS
        cmd: |-
          {{.CONTAINER_ENGINE}} run --rm -v "{{.ITEM}}:/work" -w /work \
          {{.K8S_IMAGE}} \
          kustomize build . --enable-helm \
          > "{{.ITEM}}/{{.BUILD_DIR}}/deployment.yaml" \
          && printf "✅ Built %s\n" "{{.ITEM}}" \
          || { printf "{{.RED}}❌ Failed to build %s{{.RESET}}\n" "{{.ITEM}}"; exit 1; }
  validate-schema:
    desc: Validate against Kubernetes schemas with kubeconform
    internal: true
    silent: true
    deps: [kustomize-build]
    cmds:
      - printf "\n{{.GREEN}}✅ Validating Kubernetes schemas...{{.RESET}}\n"
      - for:
          var: KUSTOMIZATION_DIRS
        cmd: |-
          {{.CONTAINER_ENGINE}} run --rm -v "{{.ITEM}}/{{.BUILD_DIR}}:/work" -w /work \
          {{.K8S_IMAGE}} \
          kubeconform \
          -summary \
          -schema-location default \
          -schema-location 'https://raw.githubusercontent.com/argoproj/argo-schema-generator/main/schema/argo_all_k8s_kustomize_schema.json' \
          -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
          /work/deployment.yaml \
          && printf "✅ Validated %s\n" "{{.ITEM}}" \
          || { printf "{{.RED}}❌ Failed to validate %s{{.RESET}}\n" "{{.ITEM}}"; exit 1; }
  kube-lint:
    desc: Run security and best practice checks with kube-linter
    internal: true
    silent: true
    deps: [kustomize-build]
    cmds:
      - printf "\n{{.GREEN}}🔒 Checking best practices with kube-linter...{{.RESET}}\n"
      - for:
          var: KUSTOMIZATION_DIRS
        cmd: |-
          {{.CONTAINER_ENGINE}} run --rm -v "{{.ITEM}}/{{.BUILD_DIR}}:/work" -v "{{.ROOT_DIR}}/.config:/config" -w /work \
          {{.KUBE_LINTER_IMAGE}} \
          lint \
          --config /config/kube-linter.yaml \
          /work/deployment.yaml \
          && printf "✅ Validated %s\n" "{{.ITEM}}" \
          || { printf "{{.RED}}❌ Failed to validate %s{{.RESET}}\n" "{{.ITEM}}"; exit 1; }
  deprecation-check:
    desc: Check for deprecated Kubernetes APIs with pluto
    internal: true
    silent: true
    deps: [kustomize-build]
    cmds:
      - printf "\n{{.GREEN}}🔒 Checking deprecated APIs...{{.RESET}}\n"
      - for:
          var: KUSTOMIZATION_DIRS
        cmd: |-
          {{.CONTAINER_ENGINE}} run --rm -v "{{.ITEM}}/{{.BUILD_DIR}}:/work" -w /work \
          {{.PLUTO_IMAGE}} \
          detect \
          /work/deployment.yaml \
          && printf "✅ Validated %s\n" "{{.ITEM}}" \
          || { printf "{{.RED}}❌ Failed to validate %s{{.RESET}}\n" "{{.ITEM}}"; exit 1; }
  polaris:
    desc: Run security and best practice checks with polaris
    internal: true
    silent: true
    deps: [kustomize-build]
    cmds:
      - printf "\n{{.GREEN}}🔒 Checking best practices with polaris...{{.RESET}}\n"
      - for:
          var: KUSTOMIZATION_DIRS
        cmd: |-
          if command -v polaris >/dev/null 2>&1; then
            polaris audit \
            --audit-path "{{.ITEM}}/{{.BUILD_DIR}}" \
            --config "{{.ROOT_DIR}}/.config/polaris.yaml" \
            --format pretty \
            --only-show-failed-tests true \
            && printf "✅ Validated %s\n" "{{.ITEM}}" \
            || { printf "{{.RED}}❌ Failed to validate %s{{.RESET}}\n" "{{.ITEM}}"; exit 1; }
          else
            {{.CONTAINER_ENGINE}} run --rm -v "{{.ITEM}}/{{.BUILD_DIR}}:/work" -w /work \
            -v "{{.ROOT_DIR}}/.config:/config" \
            {{.POLARIS_IMAGE}} \
            polaris audit \
            --audit-path /work \
            --config /config/polaris.yaml \
            --format pretty \
            --only-show-failed-tests true \
            && printf "✅ Validated %s\n" "{{.ITEM}}" \
            || { printf "{{.RED}}❌ Failed to validate %s{{.RESET}}\n" "{{.ITEM}}"; exit 1; }
          fi
