---
checks:
  # reliability
  deploymentMissingReplicas: ignore
  priorityClassNotSet: warning
  tagNotSpecified: danger
  pullPolicyNotAlways: warning
  readinessProbeMissing: warning
  livenessProbeMissing: warning
  metadataAndInstanceMismatched: warning
  pdbDisruptionsIsZero: warning
  missingPodDisruptionBudget: warning
  topologySpreadConstraint: warning
  hpaMaxAvailability: warning
  hpaMinAvailability: warning
  pdbMinAvailableGreaterThanHPAMinReplicas: warning

  # efficiency
  cpuRequestsMissing: warning
  cpuLimitsMissing: warning
  memoryRequestsMissing: warning
  memoryLimitsMissing: warning

  # security
  automountServiceAccountToken: warning
  hostIPCSet: danger
  hostPathSet: warning
  hostProcess: warning
  hostPIDSet: danger
  linuxHardening: warning
  missingNetworkPolicy: warning
  notReadOnlyRootFilesystem: warning
  privilegeEscalationAllowed: danger
  procMount: warning
  runAsRootAllowed: danger
  runAsPrivileged: danger
  dangerousCapabilities: danger
  insecureCapabilities: warning
  hostNetworkSet: danger
  hostPortSet: warning
  tlsSettingsMissing: warning
  sensitiveContainerEnvVar: danger
  # ArgoCD needs pod exec for its UI exec feature; downgraded from danger.
  clusterrolePodExecAttach: warning
  rolePodExecAttach: warning
  clusterrolebindingPodExecAttach: warning
  rolebindingClusterRolePodExecAttach: warning
  rolebindingRolePodExecAttach: warning
  # cilium-config triggers on bootstrap JSON key names — false positive.
  sensitiveConfigmapContent: warning
  clusterrolebindingClusterAdmin: danger
  rolebindingClusterAdminClusterRole: danger
  rolebindingClusterAdminRole: danger

mutations: [pullPolicyNotAlways]

exemptions:
  # CoreDNS — no service account token needed, no network policy for DNS
  - namespace: kube-system
    controllerNames: [coredns]
    rules:
      - automountServiceAccountToken
      - missingNetworkPolicy

  - namespace: kube-system
    controllerNames: [coredns-autoscaler]
    rules:
      - automountServiceAccountToken
      - linuxHardening

  # Cilium — eBPF CNI requires elevated privileges by design; vendor chart, no resource limits set
  - namespace: kube-system
    controllerNames:
      - cilium
      - cilium-envoy
      - cilium-operator
    rules:
      - runAsRootAllowed
      - runAsPrivileged
      - privilegeEscalationAllowed
      - notReadOnlyRootFilesystem
      - hostNetworkSet
      - hostPIDSet
      - hostPathSet
      - hostPortSet
      - dangerousCapabilities
      - insecureCapabilities
      - automountServiceAccountToken
      - missingNetworkPolicy
      - linuxHardening
      - metadataAndInstanceMismatched # vendor chart labels
      - topologySpreadConstraint # single-node
      - missingPodDisruptionBudget # single-node
      - pullPolicyNotAlways # vendor init containers (mount-bpf-fs, config, etc.)
      - cpuRequestsMissing # vendor chart, no defaults set
      - cpuLimitsMissing
      - memoryRequestsMissing
      - memoryLimitsMissing

  # Cilium observability components — vendor chart, no resource limits or probe tuning
  - namespace: kube-system
    controllerNames:
      - hubble-relay
      - hubble-ui
    rules:
      - cpuRequestsMissing
      - cpuLimitsMissing
      - memoryRequestsMissing
      - memoryLimitsMissing
      - livenessProbeMissing
      - readinessProbeMissing
      - automountServiceAccountToken
      - missingNetworkPolicy
      - linuxHardening
      - notReadOnlyRootFilesystem
      - insecureCapabilities
      - metadataAndInstanceMismatched # vendor chart labels
      - topologySpreadConstraint # single-node
      - missingPodDisruptionBudget # single-node
      - priorityClassNotSet # homelab
      - pullPolicyNotAlways # vendor images

  # csi-driver-smb — CSI node plugin requires host mounts and kernel privileges; vendor chart
  - namespace: kube-system
    controllerNames:
      - csi-smb-controller
      - csi-smb-node
      - csi-smb-node-win
    rules:
      - runAsRootAllowed
      - runAsPrivileged
      - privilegeEscalationAllowed
      - hostNetworkSet
      - notReadOnlyRootFilesystem
      - hostPathSet
      - automountServiceAccountToken
      - missingNetworkPolicy
      - linuxHardening
      - insecureCapabilities
      - metadataAndInstanceMismatched # vendor chart labels
      - topologySpreadConstraint # DaemonSet / single-node
      - missingPodDisruptionBudget # DaemonSet (N/A) / single-node
      - pullPolicyNotAlways # vendor init containers
      - cpuLimitsMissing # vendor chart
      - readinessProbeMissing # vendor chart
      - livenessProbeMissing # vendor chart
      - hostProcess # csi-smb-node-win Windows HostProcess; no Windows nodes in cluster

  # Talos control-plane components
  - namespace: kube-system
    controllerNames:
      - kube-apiserver
      - kube-scheduler
      - kube-controller-manager
      - etcd
    rules:
      - hostPortSet
      - hostNetworkSet
      - readinessProbeMissing
      - livenessProbeMissing
      - cpuRequestsMissing
      - cpuLimitsMissing
      - memoryRequestsMissing
      - memoryLimitsMissing
      - runAsRootAllowed
      - runAsPrivileged
      - notReadOnlyRootFilesystem
      - hostPIDSet
      - automountServiceAccountToken
      - missingNetworkPolicy

  # ArgoCD — manages cluster state, needs broad access; vendor chart
  - namespace: core-argocd
    controllerNames:
      - argocd-server
      - argocd-repo-server
      - argocd-application-controller
      - argocd-dex-server
      - argocd-redis
      - argocd-applicationset-controller
      - argocd-notifications-controller
    rules:
      - automountServiceAccountToken
      - missingNetworkPolicy
      - metadataAndInstanceMismatched # vendor chart labels
      - topologySpreadConstraint # single-node
      - missingPodDisruptionBudget # single-node
      - priorityClassNotSet # homelab
      - pullPolicyNotAlways # vendor init containers (copyutil, secret-init)
      - cpuRequestsMissing # vendor chart, no defaults set
      - cpuLimitsMissing
      - memoryRequestsMissing
      - memoryLimitsMissing
      - readinessProbeMissing # vendor chart
      - livenessProbeMissing

  # External Secrets Operator — vendor chart
  - namespace: external-secrets
    controllerNames:
      - external-secrets
      - external-secrets-webhook
      - external-secrets-cert-controller
    rules:
      - automountServiceAccountToken
      - missingNetworkPolicy
      - metadataAndInstanceMismatched # vendor chart labels
      - topologySpreadConstraint # single-node
      - missingPodDisruptionBudget # single-node
      - priorityClassNotSet # homelab
      - pullPolicyNotAlways # vendor images
      - cpuRequestsMissing # cert-controller: vendor chart, no defaults
      - cpuLimitsMissing
      - memoryRequestsMissing
      - memoryLimitsMissing
      - readinessProbeMissing # vendor chart
      - livenessProbeMissing

  # Bitwarden SDK server — vendor chart; no config PVC so writes to container FS
  - namespace: external-secrets
    controllerNames:
      - bitwarden-sdk-server
    rules:
      - automountServiceAccountToken
      - missingNetworkPolicy
      - metadataAndInstanceMismatched # vendor chart labels
      - topologySpreadConstraint # single-node
      - missingPodDisruptionBudget # single-node
      - priorityClassNotSet # homelab
      - pullPolicyNotAlways # vendor image
      - notReadOnlyRootFilesystem # vendor image writes to container FS

  # filebrowser — single-node homelab; PDB/topology/priority irrelevant.
  # notReadOnlyRootFilesystem: writes DB to container FS (no config PVC — pre-existing design gap).
  # pullPolicyNotAlways: IfNotPresent with pinned tag acceptable for homelab.
  - namespace: filebrowser
    controllerNames:
      - filebrowser
    rules:
      - missingPodDisruptionBudget
      - topologySpreadConstraint
      - priorityClassNotSet
      - notReadOnlyRootFilesystem
      - pullPolicyNotAlways
