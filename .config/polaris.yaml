---
checks:
  # reliability
  deploymentMissingReplicas: ignore
  priorityClassNotSet: warning
  tagNotSpecified: danger
  pullPolicyNotAlways: warning
  readinessProbeMissing: warning
  livenessProbeMissing: warning
  metadataAndInstanceMismatched: warning
  pdbDisruptionsIsZero: warning
  missingPodDisruptionBudget: warning
  topologySpreadConstraint: warning
  hpaMaxAvailability: warning
  hpaMinAvailability: warning
  pdbMinAvailableGreaterThanHPAMinReplicas: warning

  # efficiency
  cpuRequestsMissing: warning
  cpuLimitsMissing: warning
  memoryRequestsMissing: warning
  memoryLimitsMissing: warning

  # security
  automountServiceAccountToken: warning
  hostIPCSet: danger
  hostPathSet: warning
  hostProcess: warning
  hostPIDSet: danger
  linuxHardening: warning
  missingNetworkPolicy: warning
  notReadOnlyRootFilesystem: warning
  privilegeEscalationAllowed: danger
  procMount: warning
  runAsRootAllowed: danger
  runAsPrivileged: danger
  dangerousCapabilities: danger
  insecureCapabilities: warning
  hostNetworkSet: danger
  hostPortSet: warning
  tlsSettingsMissing: warning
  sensitiveContainerEnvVar: danger
  sensitiveConfigmapContent: danger
  clusterrolePodExecAttach: danger
  rolePodExecAttach: danger
  clusterrolebindingPodExecAttach: danger
  rolebindingClusterRolePodExecAttach: danger
  rolebindingRolePodExecAttach: danger
  clusterrolebindingClusterAdmin: danger
  rolebindingClusterAdminClusterRole: danger
  rolebindingClusterAdminRole: danger

mutations: [pullPolicyNotAlways]

exemptions:
  # CoreDNS — no service account token needed, no network policy for DNS
  - namespace: kube-system
    controllerNames: [coredns]
    rules:
      - automountServiceAccountToken
      - missingNetworkPolicy

  - namespace: kube-system
    controllerNames: [coredns-autoscaler]
    rules:
      - automountServiceAccountToken
      - linuxHardening

  # Cilium — eBPF CNI requires elevated privileges by design
  - namespace: kube-system
    controllerNames:
      - cilium
      - cilium-operator
    rules:
      - runAsRootAllowed
      - runAsPrivileged
      - notReadOnlyRootFilesystem
      - hostNetworkSet
      - hostPIDSet
      - dangerousCapabilities
      - insecureCapabilities
      - automountServiceAccountToken
      - missingNetworkPolicy
      - linuxHardening

  # csi-driver-smb — CSI node plugin requires host mounts
  - namespace: kube-system
    controllerNames:
      - csi-smb-controller
      - csi-smb-node
    rules:
      - runAsRootAllowed
      - notReadOnlyRootFilesystem
      - hostPathSet
      - automountServiceAccountToken
      - missingNetworkPolicy
      - linuxHardening

  # Talos control-plane components
  - namespace: kube-system
    controllerNames:
      - kube-apiserver
      - kube-scheduler
      - kube-controller-manager
      - etcd
    rules:
      - hostPortSet
      - hostNetworkSet
      - readinessProbeMissing
      - livenessProbeMissing
      - cpuRequestsMissing
      - cpuLimitsMissing
      - memoryRequestsMissing
      - memoryLimitsMissing
      - runAsRootAllowed
      - runAsPrivileged
      - notReadOnlyRootFilesystem
      - hostPIDSet
      - automountServiceAccountToken
      - missingNetworkPolicy

  # ArgoCD — manages cluster state, needs broad access
  - namespace: core-argocd
    controllerNames:
      - argocd-server
      - argocd-repo-server
      - argocd-application-controller
      - argocd-dex-server
      - argocd-redis
      - argocd-applicationset-controller
      - argocd-notifications-controller
    rules:
      - automountServiceAccountToken
      - missingNetworkPolicy

  # External Secrets Operator
  - namespace: external-secrets
    controllerNames:
      - external-secrets
      - external-secrets-webhook
      - external-secrets-cert-controller
    rules:
      - automountServiceAccountToken
      - missingNetworkPolicy
