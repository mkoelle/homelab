---
machine:
  # certSANs for the Talos API (talosctl). Without these, talosctl connections
  # to motherbox.local or its IP fail with certificate errors after apply.
  certSANs:
    - motherbox
    - motherbox.local
    - 192.168.1.2
  network:
    hostname: motherbox.local

cluster:
  # Disable default CNI to allow installing Cilium
  network:
    cni:
      name: none
  proxy:
    disabled: true
  apiServer:
    certSANs:
      - motherbox
      - motherbox.local
  # Allows running workload on control-plane nodes.
  # Needed because of running a single node instance
  allowSchedulingOnControlPlanes: true
