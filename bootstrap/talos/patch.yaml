---
machine:
  # certSANs for the Talos API (talosctl). Without these, talosctl connections
  # to motherbox.local or its IP fail with certificate errors after apply.
  certSANs:
    - motherbox
    - motherbox.local
    - 192.168.1.2
  network:
    hostname: motherbox
  install:
    diskSelector:
      wwid: naa.5000000000002705 # Fanxiang S101 480GB SSD (sda)
    image: factory.talos.dev/installer/7538c8ece51ab4ebc4bd5557c4a5e9c886460596656155cd6a7d23356c2c0884:v1.14.1
    wipe: true

cluster:
  # etcd metrics on a dedicated unauthenticated port -- standard Talos pattern
  # for internal-only Prometheus/Alloy scraping without needing etcd's mTLS
  # client certs. Restricted at the network layer (CiliumNetworkPolicy), not TLS.
  etcd:
    extraArgs:
      listen-metrics-urls: http://0.0.0.0:2381

---
# Talos 1.14+ document model: cluster.network.cni, cluster.proxy, cluster.apiServer,
# and cluster.allowSchedulingOnControlPlanes (legacy v1alpha1 fields, valid through
# 1.13) now conflict with auto-generated KubeNetworkConfig/KubeProxyConfig/
# KubeFlannelCNIConfig/KubeAPIServerConfig/KubeNodeConfig documents -- ArgoCD-style
# "attempting to grant/set a field already set elsewhere" errors on apply. Fixed
# live on 2026-09-21 after multiple failed apply-config attempts; codified here so
# a fresh `gen config` doesn't hit the same wall. See docs/troubleshooting/ for the
# full incident writeup if this ever needs re-deriving.
apiVersion: v1alpha1
kind: KubeProxyConfig
enabled: false # Cilium replaces kube-proxy entirely (kubeProxyReplacement: true).

---
# Disables default CNI so Cilium can install -- presence/absence of this document
# is what controls whether Flannel deploys in the new document model (setting
# cluster.network.cni.name: none does NOT suppress it; the document must not exist).
apiVersion: v1alpha1
kind: KubeFlannelCNIConfig
$patch: delete

---
# Talos audit log: secret *access* was logged at Metadata level (request existed,
# not what it returned) -- can't distinguish a benign read from exfiltration in
# post-incident forensics. RequestResponse on secrets specifically logs full
# request+response bodies; Metadata remains the default for everything else.
apiVersion: v1alpha1
kind: KubeAuditPolicyConfig
configuration:
  apiVersion: audit.k8s.io/v1
  kind: Policy
  rules:
    - level: RequestResponse
      resources:
        - group: ""
          resources: ["secrets"]
    - level: Metadata
