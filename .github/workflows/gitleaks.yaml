---
name: gitleaks

on:
  push: {}

jobs:
  scan:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The action defaults to gitleaks 8.24.3, which ignores the
          # `[[allowlists]]` table in .gitleaks.toml (newer-format config) --
          # so BSM UUID references were flagged as generic-api-key in CI while
          # passing locally. Pin to the version the allowlist was verified with.
          GITLEAKS_VERSION: "8.30.1"
