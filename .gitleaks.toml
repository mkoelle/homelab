[extend]
# Keep every upstream default rule -- this file only adds one narrowly-scoped
# allowlist on top, it doesn't redefine detection from scratch.
useDefault = true

[[allowlists]]
description = "Bitwarden Secrets Manager item UUIDs (ExternalSecret remoteRef.key, per CLAUDE.md's Secrets Pattern) are opaque item identifiers, not secret material -- the actual secret value lives in Bitwarden, never in git. gitleaks' generic-api-key rule flags a canonical UUID assigned to a YAML `key:` field as a false positive. Verified live (gitleaks v8.30.1) this suppresses exactly the known BSM-reference false positives and nothing else in this repo's tracked files."
regexes = [
  '''[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}''',
]
