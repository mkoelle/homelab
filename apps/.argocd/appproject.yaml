---
# AppProject — restricts all Applications to this repo only.
# Source repo restriction is the primary security gain: prevents any Application
# from pointing at an external malicious chart repo.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: homelab
  namespace: core-argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  description: Homelab GitOps — single repo, explicit namespace allowlist
  sourceRepos:
    - https://github.com/mkoelle/homelab
  destinations:
    - server: https://kubernetes.default.svc
      namespace: core-argocd
    - server: https://kubernetes.default.svc
      namespace: external-secrets
    - server: https://kubernetes.default.svc
      namespace: kube-system
    - server: https://kubernetes.default.svc
      namespace: filebrowser
    - server: https://kubernetes.default.svc
      namespace: core-secrets
    - server: https://kubernetes.default.svc
      namespace: cilium-secrets
    - server: https://kubernetes.default.svc
      namespace: gateway
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: ""
      kind: PersistentVolume
    - group: storage.k8s.io
      kind: StorageClass
    - group: storage.k8s.io
      kind: CSIDriver
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
    - group: cilium.io
      kind: CiliumL2AnnouncementPolicy
    - group: cilium.io
      kind: CiliumLoadBalancerIPPool
    - group: external-secrets.io
      kind: ClusterSecretStore
    - group: argoproj.io
      kind: Application
    - group: argoproj.io
      kind: ApplicationSet
    - group: argoproj.io
      kind: AppProject
    - group: gateway.networking.k8s.io
      kind: GatewayClass
