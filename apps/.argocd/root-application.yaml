---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: core-argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: homelab
  source:
    repoURL: https://github.com/mkoelle/homelab
    # TEMPORARY: root is self-managing -- revert to HEAD together with
    # apps.yaml and cilium-application.yaml, but not until this branch is
    # merged (reverting first caused ArgoCD to self-heal against unmerged
    # main and destroy live resources -- see feat/zitadel-google-login-policy
    # history for exactly why).
    targetRevision: feat/monitoring-analytics-expansion
    path: apps/.argocd
  destination:
    server: https://kubernetes.default.svc
    namespace: core-argocd
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
