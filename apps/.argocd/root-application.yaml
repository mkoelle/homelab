---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: core-argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/mkoelle/homelab
    targetRevision: HEAD
    path: apps/.argocd
  destination:
    server: https://kubernetes.default.svc
    namespace: core-argocd
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
