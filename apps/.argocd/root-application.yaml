---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: core-argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: homelab
  source:
    repoURL: https://github.com/mkoelle/homelab
    # TEMPORARY: root is self-managing (see git history) -- revert to HEAD
    # together with apps.yaml and cilium-application.yaml once this branch's
    # zitadel_login_policy fix is merged.
    targetRevision: feat/zitadel-google-login-policy
    path: apps/.argocd
  destination:
    server: https://kubernetes.default.svc
    namespace: core-argocd
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
