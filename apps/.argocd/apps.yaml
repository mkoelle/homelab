---
# ApplicationSet — one Application per homelab app via list generator.
# Cilium is intentionally absent: see cilium-application.yaml for its standalone spec.
# To add an app: create apps/<category>/<name>/kustomization.yaml, then add an element here.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: homelab-apps
  namespace: core-argocd
spec:
  generators:
    - list:
        elements:
          # Wave -2 — TLS infrastructure. Must precede external-secrets: the
          # bitwarden-sdk-server TLS cert is issued by cert-manager (see
          # apps/core/external-secrets/bitwarden-tls-cert.yaml), so its CRDs,
          # controller, webhook, and CA chain must all be Healthy first.
          - name: cert-manager
            path: apps/core/cert-manager
            namespace: cert-manager
            wave: "-2"

          # coredns-custom: LAN-only DNS override for *.hl.mkoelle.com (see
          # its configmap.yaml). Needs to land before anything that resolves
          # id.hl.mkoelle.com in-cluster (Zitadel's Terraform reconciler,
          # ArgoCD/Grafana OIDC issuer lookups) -- same wave as cert-manager,
          # no dependency between the two.
          - name: coredns-custom
            path: apps/core/coredns-custom
            namespace: kube-system
            wave: "-2"

          # Wave -1 — Secrets infrastructure (must precede all apps that consume secrets)
          - name: external-secrets
            path: apps/core/external-secrets
            namespace: external-secrets
            wave: "-1"

          # Wave 0 — GitOps layer (self-managed)
          - name: argocd
            path: apps/core/argocd
            namespace: core-argocd
            wave: "0"

          # Wave 1 — CSI drivers, identity provider
          - name: storage
            path: apps/core/storage
            namespace: kube-system
            wave: "1"

          - name: zitadel
            path: apps/core/zitadel
            namespace: zitadel
            wave: "1"

          # Wave 2 — Cluster services
          - name: gateway
            path: apps/core/gateway
            namespace: gateway
            wave: "2"

          # Wave 3 — Observability (metrics + logs)
          - name: monitoring
            path: apps/core/monitoring
            namespace: monitoring
            wave: "3"

          - name: loki
            path: apps/core/loki
            namespace: loki
            wave: "3"

          - name: alloy
            path: apps/core/alloy
            namespace: alloy
            wave: "3"

          - name: uptime-kuma
            path: apps/core/uptime-kuma
            namespace: uptime-kuma
            wave: "3"

          - name: opencost
            path: apps/core/opencost
            namespace: opencost
            wave: "3"

          # Wave 4 — User workloads
          - name: filebrowser
            path: apps/media/filebrowser
            namespace: filebrowser
            wave: "4"

  template:
    metadata:
      name: "{{name}}"
      namespace: core-argocd
      annotations:
        argocd.argoproj.io/sync-wave: "{{wave}}"
    spec:
      project: homelab
      source:
        repoURL: https://github.com/mkoelle/homelab
        # TEMPORARY: see root-application.yaml's matching note.
        targetRevision: feat/monitoring-analytics-expansion
        path: "{{path}}"
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{namespace}}"
      syncPolicy:
        automated:
          prune: false
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - ApplyOutOfSyncOnly=true
