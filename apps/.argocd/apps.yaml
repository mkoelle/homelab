---
# ApplicationSet — one Application per homelab app via list generator.
# Cilium is intentionally absent: see cilium-application.yaml for its standalone spec.
# To add an app: create apps/<category>/<name>/kustomization.yaml, then add an element here.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: homelab-apps
  namespace: core-argocd
spec:
  generators:
    - list:
        elements:
          # Wave -2 — TLS infrastructure. Must precede external-secrets: the
          # bitwarden-sdk-server TLS cert is issued by cert-manager (see
          # apps/core/external-secrets/bitwarden-tls-cert.yaml), so its CRDs,
          # controller, webhook, and CA chain must all be Healthy first.
          - name: cert-manager
            path: apps/core/cert-manager
            namespace: cert-manager
            wave: "-2"

          # coredns-custom: LAN-only DNS override for *.hl.mkoelle.com (see
          # its configmap.yaml). Needs to land before anything that resolves
          # id.hl.mkoelle.com in-cluster (Zitadel's Terraform reconciler,
          # ArgoCD/Grafana OIDC issuer lookups) -- same wave as cert-manager,
          # no dependency between the two.
          - name: coredns-custom
            path: apps/core/coredns-custom
            namespace: kube-system
            wave: "-2"

          # Wave -1 — Secrets infrastructure (must precede all apps that consume secrets)
          - name: external-secrets
            path: apps/core/external-secrets
            namespace: external-secrets
            wave: "-1"

          # Wave 0 — GitOps layer (self-managed)
          - name: argocd
            path: apps/core/argocd
            namespace: core-argocd
            wave: "0"

          # Wave 1 — CSI drivers, identity provider
          - name: storage
            path: apps/core/storage
            namespace: kube-system
            wave: "1"

          - name: zitadel
            path: apps/core/zitadel
            namespace: zitadel
            wave: "1"

          # Tetragon: eBPF runtime sensor, same tier as the other platform
          # DaemonSets. Installs into kube-system (upstream's recommended
          # namespace) and needs Cilium (wave 0) already Healthy.
          - name: tetragon
            path: apps/core/tetragon
            namespace: kube-system
            wave: "1"

          # Wave 2 — Cluster services
          - name: gateway
            path: apps/core/gateway
            namespace: gateway
            wave: "2"

          # Wave 3 — Observability (metrics + logs)
          - name: monitoring
            path: apps/core/monitoring
            namespace: monitoring
            wave: "3"

          - name: loki
            path: apps/core/loki
            namespace: loki
            wave: "3"

          - name: alloy
            path: apps/core/alloy
            namespace: alloy
            wave: "3"

          - name: uptime-kuma
            path: apps/core/uptime-kuma
            namespace: uptime-kuma
            wave: "3"

          - name: opencost
            path: apps/core/opencost
            namespace: opencost
            wave: "3"

          # Wave 4/5 records desired ordering in Application metadata. The
          # ApplicationSet controller creates child Applications asynchronously,
          # so the waves do not serialize their first sync; operator scan-job
          # limits/schedules provide the actual single-node controls.
          - name: kubescape
            path: apps/core/kubescape
            namespace: kubescape
            wave: "4"

          - name: trivy-operator
            path: apps/core/trivy-operator
            namespace: trivy-operator
            wave: "5"

          # Wave 6 — User workloads
          - name: filebrowser
            path: apps/media/filebrowser
            namespace: filebrowser
            wave: "6"

          - name: homepage
            path: apps/core/homepage
            namespace: homepage
            wave: "6"

          # Wave 7 — Admission enforcement, deliberately last. Kyverno's
          # webhook affects every future request cluster-wide once
          # registered, regardless of wave; installing it after every other
          # app has already synced at least once means its namespace
          # exclusions (kube-system, core-argocd) are tested against real
          # manifests, not guessed at cold-start. features.
          # forceFailurePolicyIgnore keeps it fail-open even so. Audit mode
          # only — no ClusterPolicy resources shipped yet, see
          # docs/planning/security.md Phase 3.
          - name: kyverno
            path: apps/core/kyverno
            namespace: kyverno
            wave: "7"

  template:
    metadata:
      name: "{{name}}"
      namespace: core-argocd
      annotations:
        argocd.argoproj.io/sync-wave: "{{wave}}"
    spec:
      project: homelab
      source:
        repoURL: https://github.com/mkoelle/homelab
        targetRevision: feat/security
        path: "{{path}}"
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{namespace}}"
      # `kubectl rollout restart` is an operational trigger used for
      # security rescans/maintenance. Ignore only its generated Pod-template
      # timestamp so self-heal does not immediately undo the restart.
      ignoreDifferences:
        - group: apps
          kind: Deployment
          jsonPointers:
            - /spec/template/metadata/annotations/kubectl.kubernetes.io~1restartedAt
        - group: apps
          kind: StatefulSet
          jsonPointers:
            - /spec/template/metadata/annotations/kubectl.kubernetes.io~1restartedAt
        - group: apps
          kind: DaemonSet
          jsonPointers:
            - /spec/template/metadata/annotations/kubectl.kubernetes.io~1restartedAt
      syncPolicy:
        automated:
          # Deliberate deletion-safety default: removed manifests are not
          # pruned automatically. Retiring an app/resource requires an
          # explicit cleanup; see docs/planning/plan.md.
          prune: false
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - ApplyOutOfSyncOnly=true
