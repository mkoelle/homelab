---
# Dynamic node-local storage (rancher/local-path-provisioner) -- the
# `local-path` StorageClass named in ADR 0004. Lets consumers (first: the
# homelab-media tenant, via its quota in apps/core/tenant-media) create
# node-local PVCs themselves, instead of homelab hand-writing one `local` PV
# + host-dir init Job per app. Volumes are directories on motherbox's SSD:
# NOT backed up, lost on a node rebuild; size requests are not enforced
# (hostPath), only capped by ResourceQuota.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: local-path-storage

resources:
  - https://raw.githubusercontent.com/rancher/local-path-provisioner/v0.0.37/deploy/local-path-storage.yaml

patches:
  # Helper pods (setup/teardown) mount hostPath -- Talos's cluster-default
  # PSA (baseline) would reject them. Privileged only in this namespace;
  # nothing else runs here.
  - target:
      kind: Namespace
      name: local-path-storage
    patch: |
      - op: add
        path: /metadata/labels
        value:
          pod-security.kubernetes.io/enforce: privileged
          pod-security.kubernetes.io/audit: privileged
          pod-security.kubernetes.io/warn: privileged
  # Base dir under /var/lib/kubelet, not upstream's /opt: Talos's rootfs is
  # read-only, and kubelet (containerized on Talos) only reliably sees paths
  # under its own state tree -- same reason as apps/core/zitadel/volume.yaml.
  # Helper image pinned (upstream leaves busybox unversioned).
  - target:
      kind: ConfigMap
      name: local-path-config
    patch: |
      - op: replace
        path: /data/config.json
        value: |-
          {
                  "nodePathMap":[
                  {
                          "node":"DEFAULT_PATH_FOR_NON_LISTED_NODES",
                          "paths":["/var/lib/kubelet/local-path-provisioner"]
                  }
                  ]
          }
      - op: replace
        path: /data/helperPod.yaml
        value: |-
          apiVersion: v1
          kind: Pod
          metadata:
            name: helper-pod
          spec:
            priorityClassName: system-node-critical
            tolerations:
              - key: node.kubernetes.io/disk-pressure
                operator: Exists
                effect: NoSchedule
            containers:
            - name: helper-pod
              image: docker.io/library/busybox:1.37.0
              imagePullPolicy: IfNotPresent
  # The provisioner itself only talks to the API server -- run it
  # non-root with the CLAUDE.md defaults. Helper pods (above) stay root:
  # they create/delete directories on the host.
  - target:
      kind: Deployment
      name: local-path-provisioner
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: local-path-provisioner
      spec:
        template:
          spec:
            securityContext:
              runAsNonRoot: true
              runAsUser: 65534
              runAsGroup: 65534
              seccompProfile:
                type: RuntimeDefault
            containers:
              - name: local-path-provisioner
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop: [ALL]
                resources:
                  requests:
                    cpu: 10m
                    memory: 32Mi
                  limits:
                    cpu: 200m
                    memory: 128Mi
