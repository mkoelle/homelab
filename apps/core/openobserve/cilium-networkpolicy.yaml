---
# Gateway API traffic (its own UI, see httproute.yaml) is forwarded by
# Cilium's Envoy under the reserved "ingress" identity, not the "gateway"
# namespace's own pod identity -- same finding as
# apps/core/monitoring/cilium-networkpolicy.yaml, a plain NetworkPolicy
# namespaceSelector rule can't match it.
apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: openobserve-gateway
  namespace: openobserve
spec:
  endpointSelector: {}
  ingress:
    - fromEntities:
        - "ingress"
      toPorts:
        - ports:
            - port: "5080"
              protocol: TCP
