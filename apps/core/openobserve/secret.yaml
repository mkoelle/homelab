---
# ExternalSecret — pulls OpenObserve's root user credentials from Bitwarden
# Secrets Manager, same pattern as apps/core/monitoring/grafana-admin-secret.yaml.
# These same credentials are also read by Alloy (apps/core/alloy/values.yaml's
# loki.write basic_auth) to authenticate log pushes, and by
# apps/core/monitoring/values-grafana.yaml's OpenObserve datasource -- one
# Secret, three consumers, no credential drift between them.
#
# Before applying: add a Bitwarden Secrets Manager item with email/password
# and replace the UUIDs below with their BSM IDs.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openobserve-root
  namespace: openobserve
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  target:
    name: openobserve-root
    creationPolicy: Owner
  data:
    # secretKey names match OpenObserve's own env var names exactly --
    # deployment.yaml consumes this Secret via envFrom, which uses each key
    # as the literal env var name, so ZO_ROOT_USER_EMAIL below becomes the
    # env var ZO_ROOT_USER_EMAIL directly.
    - secretKey: ZO_ROOT_USER_EMAIL
      remoteRef:
        key: "3b537e08-311e-452e-9f67-e6a51bc65e05"
    - secretKey: ZO_ROOT_USER_PASSWORD
      remoteRef:
        key: "63881000-f556-4b4f-a394-aa2acd2943f0"
