---
# Ingress-only. Single port (5080) serves ingestion, query, and UI alike --
# Alloy pushes logs, Grafana's datasource plugin queries them, both need
# reach. Its own UI is reached via Gateway, see cilium-networkpolicy.yaml.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openobserve-policy
  namespace: openobserve
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: alloy
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 5080
