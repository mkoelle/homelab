---
# Render CRDs as static manifests instead of letting tetragon-operator install
# them at runtime ("operator" method). GitOps needs TracingPolicy's CRD to
# exist before any TracingPolicy resource is applied; the runtime-install
# method races that on first sync.
crds:
  installMethod: helm

# Upstream Talos instructions require this mount for kernel tracing access.
# https://tetragon.io/docs/installation/kubernetes/
extraHostPathMounts:
  - name: sys-kernel-tracing
    mountPath: /sys/kernel/tracing
    hostPath: /sys/kernel/tracing

tetragon:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # Bound event volume before widening scope. -1 (unlimited) is the chart
  # default; this cluster's Loki storage is ephemeral and single-node.
  exportRateLimit: 500

  # Widened from the chart default:
  #   exportDenyList: |-
  #     {"health_check":true}
  #     {"namespace":["", "cilium", "kube-system"]}
  # Host/cilium/kube-system are exactly the platform components most
  # relevant to cluster compromise, so include them. Keep the health-check
  # suppression line — that one isn't a coverage gap, just noise reduction.
  exportDenyList: |-
    {"health_check":true}

  # Verified before widening scope: this cluster's secret-injection
  # convention is env-var/file-based (ExternalSecrets -> Secret -> `_FILE`
  # env refs or volume mounts, e.g. apps/core/zitadel's Postgres), not CLI
  # flags — grepped all rendered manifests, no `--password=`-style literal
  # args exist today. These filters are a structural guard for whatever
  # gets deployed next, not a response to a live leak. RE2 patterns,
  # capture groups get redacted.
  redactionFilters: |-
    {"redact": ["(?i)--?password(?:[=\\s]+)(\\S+)"]}
    {"redact": ["(?i)--?(?:api[-_]?key|token|secret)(?:[=\\s]+)(\\S+)"]}
    {"redact": ["(?i)Authorization:\\s*(\\S+)"]}
    {"redact": ["://[^:/@\\s]+:([^@\\s]+)@"]}

tetragonOperator:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

export:
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi
  stdout: {}

# Metrics scrape intentionally not wired up: Alloy already collects the
# export-stdout sidecar's container logs into Loki (no ServiceMonitor CRD
# needed, matches this cluster's existing scrape pattern). Add a metrics
# Service/annotation later only if Loki-based event-rate dashboards prove
# insufficient.
