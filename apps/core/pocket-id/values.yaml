---
# id.motherbox.local resolves via the same L2-announced Gateway LB IP as every
# other app in this repo (see apps/core/gateway/httproute.yaml pattern).
host: "id.motherbox.local"
trustProxy: true

database:
  connectionString: "file:data/pocket-id.db"

# Chart normally generates this Secret from plaintext values.encryptionKey /
# values.database.connectionString. We supply it externally instead via
# ExternalSecret (see externalsecret.yaml) so the encryption key never lands
# in git.
secret:
  create: false
  name: pocket-id-secret

pocketID:
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "1Gi"
      cpu: "1000m"
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile:
      type: RuntimeDefault

podSecurityContext:
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

service:
  type: ClusterIP
  port: 80

persistence:
  data:
    # PVC bound to a hand-written `local` PV (volume.yaml), not persistence.data.hostPath:
    # pod-security "restricted" (this namespace's enforcement level) forbids the
    # hostPath volume TYPE outright, confirmed live via FailedCreate ("restricted
    # volume types ... uses restricted volume type hostPath"). A PVC is an
    # allowed volume type under "restricted" regardless of what backs the PV,
    # so the same on-disk directory is exposed through a `local` PV instead.
    # No dynamic provisioner in this cluster (local-path-provisioner is Phase 3,
    # not implemented) -- volume-init-job.yaml pre-creates the host directory
    # the static PV points at.
    enabled: true
    existingClaim: "pocket-id-data"
