---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# No top-level namespace transformer: every plain resource sets its own
# metadata.namespace explicitly (see volume-init-job.yaml, which must land in
# kube-system, not pocket-id). helmCharts below sets its own namespace: field.

resources:
  - namespace.yaml
  - networkpolicy.yaml
  - cilium-networkpolicy.yaml
  - externalsecret.yaml
  - httproute.yaml
  - storageclass.yaml
  - volume.yaml
  - volume-init-job.yaml

helmCharts:
  - name: pocket-id
    repo: https://anza-labs.github.io/charts
    version: 2.2.1
    releaseName: pocket-id
    namespace: pocket-id
    valuesFile: values.yaml
