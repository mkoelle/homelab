---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: pocket-id

resources:
  - namespace.yaml
  - networkpolicy.yaml
  - cilium-networkpolicy.yaml
  - externalsecret.yaml
  - httproute.yaml

helmCharts:
  - name: pocket-id
    repo: https://anza-labs.github.io/charts
    version: 2.2.1
    releaseName: pocket-id
    namespace: pocket-id
    valuesFile: values.yaml
