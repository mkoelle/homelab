---
# One-time host-directory creation for volume.yaml's `local` PV. `local`
# volumes (unlike hostPath's type: DirectoryOrCreate) never auto-create their
# target path -- kubelet only bind-mounts it. Talos has no shell/SSH access to
# do this by hand, so a privileged Job does it instead. Runs in kube-system
# (no PodSecurity restriction there, same carve-out as prometheus-node-exporter)
# since pocket-id's own namespace enforces "restricted", which forbids hostPath
# entirely -- this Job needs it exactly once to prepare the directory that
# volume.yaml's PV then references.
apiVersion: batch/v1
kind: Job
metadata:
  name: pocket-id-data-dir-init
  namespace: kube-system
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: OnFailure
      nodeSelector:
        kubernetes.io/hostname: motherbox
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: init
          image: busybox:1.36
          command:
            - sh
            - -c
            - mkdir -p /host/var/lib/pocket-id-data && chmod 0770 /host/var/lib/pocket-id-data
          securityContext:
            # runAsUser 0 is required: mkdir/chmod target a root-owned directory
            # on the host. Explicit rather than default-context, per KSV-0118.
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: host-var-lib
              mountPath: /host/var/lib
      volumes:
        - name: host-var-lib
          hostPath:
            path: /var/lib
