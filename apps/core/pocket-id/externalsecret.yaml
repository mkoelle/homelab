---
# ExternalSecret — pulls the pocket-id encryption key from Bitwarden Secrets
# Manager. secret.create: false in values.yaml (chart normally generates this
# Secret itself from plaintext values) lets this externally-sourced Secret
# supply ENCRYPTION_KEY/DB_CONNECTION_STRING via envFrom instead.
#
# Before applying: create a Bitwarden SM item holding the generated key
# (UHN2r225ptE6oThZkYNdU0HE4vkw670A2CF1lYX9KPo=, from `openssl rand -base64 32`)
# and replace the UUID below with its BSM item ID.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pocket-id-secret
  namespace: pocket-id
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  target:
    name: pocket-id-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        ENCRYPTION_KEY: "{{ .encryptionKey }}"
        DB_CONNECTION_STRING: "file:data/pocket-id.db"
  data:
    - secretKey: encryptionKey
      remoteRef:
        key: "f878dfed-4b12-4090-b889-b4cd0114578f"
