---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: trivy-operator

resources:
  - namespace.yaml
  - networkpolicy.yaml

helmCharts:
  - name: trivy-operator
    repo: https://aquasecurity.github.io/helm-charts/
    version: 0.36.0
    releaseName: trivy-operator
    namespace: trivy-operator
    includeCRDs: true
    valuesFile: values.yaml
