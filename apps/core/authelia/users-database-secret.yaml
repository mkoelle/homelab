---
# ExternalSecret -- builds users_database.yml (Authelia's file-based auth
# backend) from a single Bitwarden item holding mkoelle's argon2id password
# hash. Mounted read-only via secret.additionalSecrets in values.yaml (the
# additionalSecrets dict KEY must equal this Secret's name -- that's how the
# chart looks it up, not an arbitrary label) at
# /secrets/users-database/users_database.yml. Read-only is fine here:
# authentication_backend.password_reset/password_change are both disabled in
# values.yaml, so Authelia never needs to write back to this file.
#
# Before applying: generate a password and its hash --
#   docker run --rm authelia/authelia:4.39.24 authelia crypto hash generate \
#     argon2 --variant argon2id --no-confirm --random
# add a Bitwarden SM item with the hash (starts "$argon2id$..."), replace the
# UUID below. The plaintext password is mkoelle's actual Authelia login --
# save it somewhere safe, it isn't stored in git or in this ExternalSecret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authelia-users-database
  namespace: authelia
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  target:
    name: authelia-users-database
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        users_database.yml: |
          users:
            mkoelle:
              disabled: false
              displayname: "Mark Koelle"
              password: "{{ .passwordHash }}"
              email: mkoelle@gmail.com
              groups:
                - admins
  data:
    - secretKey: passwordHash
      remoteRef:
        key: "<REPLACE-WITH-BSM-UUID-FOR-AUTHELIA-MKOELLE-PASSWORD-HASH>"
