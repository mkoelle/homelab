---
# ExternalSecret -- pulls all of Authelia's core random secrets plus the
# PBKDF2 hashes of the ArgoCD/Grafana OIDC client secrets from Bitwarden
# Secrets Manager. secret.existingSecret: authelia-secrets in values.yaml
# points the chart at this Secret; every key here is mounted as a file at
# /secrets/<key> (Authelia's own `{{ secret "path" }}` config templating
# reads it at container startup) -- the key names are literally the paths
# referenced from values.yaml, not arbitrary labels.
#
# Before applying, generate and add six Bitwarden SM items:
#   - identity_validation.reset_password.jwt.hmac.key: random string, 64+ bytes
#     (openssl rand -base64 64)
#   - session.encryption.key: random string, 64+ bytes (openssl rand -base64 64)
#   - storage.encryption.key: random string, 64+ bytes (openssl rand -base64 64)
#   - identity_providers.oidc.hmac.key: random string, 64+ bytes (openssl rand -base64 64)
#   - identity_providers.oidc.jwks.key: RSA private key PEM (openssl genrsa 4096)
#   - oidc.clients.argocd.secret / oidc.clients.grafana.secret: PBKDF2-SHA512
#     hash of the plaintext client secrets in apps/core/argocd/oidc-secret.yaml
#     and apps/core/monitoring/grafana-oidc-secret.yaml -- generate via
#     `docker run --rm authelia/authelia:4.39.24 authelia crypto hash generate
#     pbkdf2 --variant sha512 --no-confirm --password '<plaintext-secret>'`
# then replace the UUIDs below with their BSM item IDs.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authelia-secrets
  namespace: authelia
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  target:
    name: authelia-secrets
    creationPolicy: Owner
  data:
    - secretKey: identity_validation.reset_password.jwt.hmac.key
      remoteRef:
        key: "<REPLACE-WITH-BSM-UUID-FOR-AUTHELIA-JWT-HMAC>"
    - secretKey: session.encryption.key
      remoteRef:
        key: "<REPLACE-WITH-BSM-UUID-FOR-AUTHELIA-SESSION-KEY>"
    - secretKey: storage.encryption.key
      remoteRef:
        key: "<REPLACE-WITH-BSM-UUID-FOR-AUTHELIA-STORAGE-KEY>"
    - secretKey: identity_providers.oidc.hmac.key
      remoteRef:
        key: "<REPLACE-WITH-BSM-UUID-FOR-AUTHELIA-OIDC-HMAC>"
    - secretKey: identity_providers.oidc.jwks.key
      remoteRef:
        key: "<REPLACE-WITH-BSM-UUID-FOR-AUTHELIA-OIDC-ISSUER-KEY>"
    - secretKey: oidc.clients.argocd.secret
      remoteRef:
        key: "<REPLACE-WITH-BSM-UUID-FOR-AUTHELIA-ARGOCD-CLIENT-SECRET-HASH>"
    - secretKey: oidc.clients.grafana.secret
      remoteRef:
        key: "<REPLACE-WITH-BSM-UUID-FOR-AUTHELIA-GRAFANA-CLIENT-SECRET-HASH>"
