---
apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: authelia-gateway
  namespace: authelia
spec:
  endpointSelector: {}
  ingress:
    # Gateway API proxy: Envoy-forwarded traffic carries the reserved "ingress"
    # identity, not a namespace-based pod identity (see
    # apps/core/monitoring/cilium-networkpolicy.yaml for the same pattern).
    - fromEntities:
        - "ingress"
      toPorts:
        - ports:
            - port: "9091"
              protocol: TCP
    # ArgoCD/Grafana calling Authelia's token/userinfo endpoints server-side
    # during the OIDC code exchange (not proxied through the Gateway).
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: core-argocd
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
      toPorts:
        - ports:
            - port: "9091"
              protocol: TCP
  egress:
    # kube-apiserver entity matches post-DNAT regardless of IP/port
    # (kubeProxyReplacement workaround, same as other apps in this repo).
    - toEntities:
        - "kube-apiserver"
