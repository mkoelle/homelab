---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# No top-level namespace transformer: every plain resource sets its own
# metadata.namespace explicitly (see volume-init-job.yaml, which must land in
# kube-system, not authelia). helmCharts below sets its own namespace: field.

resources:
  - namespace.yaml
  - networkpolicy.yaml
  - cilium-networkpolicy.yaml
  - storageclass.yaml
  - volume.yaml
  - volume-init-job.yaml
  - secrets.yaml
  - users-database-secret.yaml
  - httproute.yaml

helmCharts:
  - name: authelia
    repo: https://charts.authelia.com
    version: 0.11.22
    releaseName: authelia
    namespace: authelia
    valuesFile: values.yaml
