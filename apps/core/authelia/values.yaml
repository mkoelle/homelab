---
enabled: true

pod:
  # Chart defaults to DaemonSet (fine for genuinely node-local auth agents,
  # wrong shape for a single stateful identity provider). Deployment + 1
  # replica matches every other app in this repo.
  kind: Deployment
  replicas: 1
  securityContext:
    container:
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
      runAsNonRoot: true
      runAsUser: 1000
      seccompProfile:
        type: RuntimeDefault
    pod:
      fsGroup: 1000
      seccompProfile:
        type: RuntimeDefault
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "1Gi"
      cpu: "1000m"

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false # exposed via Gateway API HTTPRoute instead, see httproute.yaml
  gatewayAPI:
    enabled: false # hand-rolled HTTPRoute instead -- see httproute.yaml for why

persistence:
  enabled: true
  existingClaim: authelia-data

# All core secrets plus the ArgoCD/Grafana OIDC client-secret hashes come from
# a single externally-managed Secret (see secrets.yaml) -- none of them are
# safe to generate in-cluster via the chart's own `value:`/auto-generate path,
# which would either put plaintext in this values file or create secrets
# ArgoCD can't reproduce declaratively.
secret:
  existingSecret: authelia-secrets
  additionalSecrets:
    # Dict key must equal the target Secret's name -- see users-database-secret.yaml.
    authelia-users-database:
      path: 'users-database'
      items:
        - key: users_database.yml
          path: users_database.yml
    # The chart's secret.existingSecret volume only auto-mounts the four
    # "standard" secret paths it hardcodes (jwt hmac, session/storage
    # encryption keys, oidc hmac) at /secrets/internal -- confirmed via
    # `kustomize build`: jwks.key and both client_secret paths never got
    # mounted anywhere, which would have failed at container startup.
    # Re-declaring the SAME Secret here (dict key must equal the real Secret
    # name) gives those three keys their own mount, at /secrets/oidc/.
    authelia-secrets:
      path: 'oidc'
      items:
        - key: identity_providers.oidc.jwks.key
          path: jwks.key
        - key: oidc.clients.argocd.secret
          path: clients.argocd.secret
        - key: oidc.clients.grafana.secret
          path: clients.grafana.secret

configMap:
  # Multi-cookie-domain session config requires at least one entry.
  # No default_redirection_url: Authelia derives an implicit authelia_url
  # (https://auth.motherbox.local) from domain+subdomain, and rejects
  # default_redirection_url being set to that same value (confirmed live --
  # "is effectively equal to option 'authelia_url' ... not permitted"). Not
  # needed anyway: no forward-auth-protected apps in this cluster, and both
  # OIDC clients (ArgoCD, Grafana) specify their own redirect_uris.
  session:
    cookies:
      - domain: motherbox.local
        subdomain: auth

  # No forward-auth in this cluster (ArgoCD/Grafana use Authelia purely as an
  # OIDC provider, not proxy-auth), so access_control's default_policy never
  # actually gates anything -- left at the chart's safe default (deny, no rules).

  authentication_backend:
    password_reset:
      disable: true
    password_change:
      disable: true
    file:
      enabled: true
      # Mounted read-only from a Secret (see secret.additionalSecrets above),
      # not the writable /config PVC -- password_reset/change are both
      # disabled, so nothing ever needs to write back to this file.
      path: '/secrets/users-database/users_database.yml'

  storage:
    local:
      enabled: true
      # Lives on the /config PVC (persistence.existingClaim above) --
      # WebAuthn/OIDC-consent/regulation records need real read-write
      # persistence across restarts, unlike the read-only users database.

  notifier:
    filesystem:
      enabled: true
      # No SMTP configured -- password reset is disabled anyway, so this only
      # ever fires for the (also mostly unused) identity-verification emails.
      # Writes to the /config PVC instead of actually sending anything.

  identity_providers:
    oidc:
      enabled: true
      # HMAC secret, JWKS signing key, and both client secrets are supplied
      # via secret.existingSecret above -- key names below are the literal
      # filenames Authelia reads relative to /secrets.
      jwks:
        - key_id: 'main'
          algorithm: 'RS256'
          key:
            # Must be absolute: unlike the chart's four "standard" secret paths
            # (resolved via env vars the chart itself builds into a full path),
            # jwks/client_secret go through Authelia's OWN `{{ secret "path" }}`
            # runtime template function, which takes the path literally --
            # confirmed live: a relative path here ("oidc/jwks.key") failed
            # with "no such file or directory", cascading into a fully broken
            # config since the template render aborted mid-file.
            path: '/secrets/oidc/jwks.key'
      clients:
        - client_id: 'argocd'
          client_name: 'ArgoCD'
          client_secret:
            path: '/secrets/oidc/clients.argocd.secret'
          public: false
          redirect_uris:
            - 'https://argocd.motherbox.local/auth/callback'
          scopes: ['openid', 'profile', 'email', 'groups']
          grant_types: ['authorization_code']
          response_types: ['code']
          # one_factor, not the chart default two_factor: homelab-scale, no
          # TOTP/WebAuthn enrollment friction. Bump per-client if wanted later.
          authorization_policy: 'one_factor'
        - client_id: 'grafana'
          client_name: 'Grafana'
          client_secret:
            path: '/secrets/oidc/clients.grafana.secret'
          public: false
          redirect_uris:
            - 'https://grafana.motherbox.local/login/generic_oauth'
          scopes: ['openid', 'profile', 'email', 'groups']
          grant_types: ['authorization_code']
          response_types: ['code']
          authorization_policy: 'one_factor'
