---
apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: external-secrets-kube-apiserver
  namespace: external-secrets
spec:
  endpointSelector: {}
  egress:
    - toEntities:
        - "kube-apiserver"
---
# Restrict bitwarden-sdk-server ingress on port 9998 to ESO controller only.
# Prevents other pods in the namespace from reaching the unencrypted SDK server.
apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: bitwarden-sdk-server-restrict
  namespace: external-secrets
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: bitwarden-sdk-server
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: external-secrets
      toPorts:
        - ports:
            - port: "9998"
              protocol: TCP
