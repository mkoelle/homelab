---
# Deny ingress from other namespaces. ESO components communicate intra-namespace
# (controller → bitwarden-sdk-server sidecar). Cross-namespace ingress is blocked.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-cross-namespace-ingress
  namespace: external-secrets
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
---
# core-secrets holds only materialized Secrets — no pods should run here.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: core-secrets
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
