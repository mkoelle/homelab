---
# ExternalSecret — pulls SMB credentials from Bitwarden Secrets Manager and
# materializes them as a Kubernetes Secret in core-secrets for the CSI driver.
#
# Before applying: add two secrets to Bitwarden Secrets Manager under the homelab
# project and replace the UUIDs below with their BSM IDs.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: smb-creds
  namespace: core-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  target:
    name: smb-creds
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: "<REPLACE-WITH-BSM-UUID-FOR-SMB-USERNAME>"
    - secretKey: password
      remoteRef:
        key: "<REPLACE-WITH-BSM-UUID-FOR-SMB-PASSWORD>"
