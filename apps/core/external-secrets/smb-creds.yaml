---
# ExternalSecret — pulls SMB credentials from Bitwarden Secrets Manager and
# materializes them as a Kubernetes Secret in core-secrets for the CSI driver.
#
# Before applying: add two secrets to Bitwarden Secrets Manager under the homelab
# project and replace the UUIDs below with their BSM IDs.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: smb-creds
  namespace: core-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  target:
    name: smb-creds
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: "ce211409-8caa-41c3-a798-b4800035e38f"
    - secretKey: password
      remoteRef:
        key: "3bdc6e8e-378b-4707-9837-b4800036105f"
