---
# Enable the Bitwarden SDK server sidecar.
# TLS disabled — server is cluster-internal only; use http:// in ClusterSecretStore.
bitwarden-sdk-server:
  enabled: true
  image:
    tls:
      enabled: false
  resources:
    requests:
      memory: 64Mi
      cpu: 10m
    limits:
      memory: 256Mi
      cpu: 250m

# ESO controller resource limits
resources:
  requests:
    memory: 128Mi
    cpu: 50m
  limits:
    memory: 512Mi
    cpu: 500m
