---
# Enable the Bitwarden SDK server sidecar.
# TLS required — the ESO Bitwarden provider unconditionally builds an HTTPS
# client and fails ("failed to append caBundle") without it, regardless of
# network exposure. Cert issued by cert-manager (bitwarden-tls-cert.yaml)
# off this cluster's self-signed CA (apps/core/cert-manager/ca-bootstrap.yaml)
# — auto-renewing, no manual bootstrap step.
bitwarden-sdk-server:
  enabled: true
  image:
    tls:
      enabled: true
      secretName: bitwarden-tls-certs
  resources:
    requests:
      memory: 64Mi
      cpu: 10m
    limits:
      memory: 256Mi
      cpu: 250m

# ESO controller resource limits
resources:
  requests:
    memory: 128Mi
    cpu: 50m
  limits:
    memory: 512Mi
    cpu: 500m
