---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: bitwarden-secretsmanager
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  provider:
    bitwardensecretsmanager:
      auth:
        secretRef:
          credentials:
            name: bitwarden-access-token
            key: token
            namespace: external-secrets
      # bitwarden-sdk-server runs insecure (no TLS) — cluster-internal only
      bitwardenServerSDKURL: "http://bitwarden-sdk-server.external-secrets.svc.cluster.local:9998"
      # Replace with real IDs from Bitwarden SM dashboard (organization URL → org ID; project settings → project ID)
      organizationID: "f145fbc0-dc61-4076-ba78-af7d0117c5b7"
      projectID: "9bede536-6098-4729-8aa0-b43d005178db"
