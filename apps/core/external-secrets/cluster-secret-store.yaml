---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: bitwarden-secretsmanager
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  # Namespace allowlist -- every namespace that currently has an
  # ExternalSecret against this store. Without it, ANY namespace (including
  # the homelab-media tenant's `media`) could read ANY secret in the homelab
  # BSM project. Add a namespace here when a new homelab app needs secrets.
  # The media tenant is deliberately absent (ADR 0008); when it first needs
  # secrets, give it its own BSM project + machine account behind a separate
  # ClusterSecretStore conditioned on namespace media.
  conditions:
    - namespaces:
        - alloy
        - cert-manager
        - core-argocd
        - core-secrets
        - monitoring
        - zitadel
  provider:
    bitwardensecretsmanager:
      auth:
        secretRef:
          credentials:
            name: bitwarden-access-token
            key: token
            namespace: external-secrets
      bitwardenServerSDKURL: "https://bitwarden-sdk-server.external-secrets.svc.cluster.local:9998"
      caProvider:
        type: Secret
        name: bitwarden-tls-certs
        key: ca.crt
        namespace: external-secrets
      # Replace with real IDs from Bitwarden SM dashboard (organization URL → org ID; project settings → project ID)
      organizationID: "f145fbc0-dc61-4076-ba78-af7d0117c5b7"
      projectID: "9bede536-6098-4729-8aa0-b43d005178db"
