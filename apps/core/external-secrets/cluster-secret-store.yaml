---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: bitwarden-secretsmanager
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  # Namespace allowlist -- every namespace that has an ExternalSecret against
  # this store. Without it, ANY namespace could read ANY secret in the
  # homelab BSM project. Add a namespace here when a new homelab app needs
  # secrets.
  #
  # `media` (the homelab-media tenant, ADR 0008) is here ONLY so homelab's
  # own tenant-media app can place the SMB credentials there
  # (apps/core/tenant-media/smb-media-creds.yaml). That's safe only because
  # the `media` AppProject blacklists every external-secrets.io kind, so the
  # tenant repo can't create its own ExternalSecrets in `media` -- keep
  # those two things in lockstep.
  conditions:
    - namespaces:
        - alloy
        - cert-manager
        - core-argocd
        - core-secrets
        - media
        - monitoring
        - zitadel
  provider:
    bitwardensecretsmanager:
      auth:
        secretRef:
          credentials:
            name: bitwarden-access-token
            key: token
            namespace: external-secrets
      bitwardenServerSDKURL: "https://bitwarden-sdk-server.external-secrets.svc.cluster.local:9998"
      caProvider:
        type: Secret
        name: bitwarden-tls-certs
        key: ca.crt
        namespace: external-secrets
      # Replace with real IDs from Bitwarden SM dashboard (organization URL → org ID; project settings → project ID)
      organizationID: "f145fbc0-dc61-4076-ba78-af7d0117c5b7"
      projectID: "9bede536-6098-4729-8aa0-b43d005178db"
