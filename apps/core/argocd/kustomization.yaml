---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: core-argocd

resources:
  - namespace.yaml
  - networkpolicy.yaml
  - cilium-networkpolicy.yaml
  - httproute.yaml
  - homelab-ca-configmap.yaml
  - github.com/argoproj/argo-cd//manifests/cluster-install?ref=v3.5.3

openapi:
  path: https://raw.githubusercontent.com/argoproj/argo-schema-generator/main/schema/argo_all_k8s_kustomize_schema.json

patches:
  - path: patch-deployments.yaml
  - path: patch-statefulsets.yaml
  - path: patch-argocd-server-ca.yaml
    target:
      kind: Deployment
      name: argocd-server
  - path: patch-argocd-server-hostalias.yaml
    target:
      kind: Deployment
      name: argocd-server
  # Kustomize namespace transformer does not update subjects[].namespace in ClusterRoleBindings.
  # ArgoCD chart hardcodes namespace: argocd — patch all three to use the actual namespace.
  #
  # This binding also points at the built-in cluster-admin ClusterRole
  # instead of the chart's own argocd-application-controller ClusterRole
  # (see the removed /rules patch this replaced, in git history). A hand-
  # maintained `*`/`*` rule list already covered ordinary CRUD, but hit two
  # separate Kubernetes RBAC escalation gates back to back deploying
  # Kyverno: first the general "attempting to grant permissions not
  # currently held" check (needs escalate/bind to create RoleBindings or
  # ClusterRoles with rules the creator doesn't have), then the *stricter*,
  # aggregationRule-specific check ("must have cluster-admin privileges to
  # use the aggregationRule") which requires true unrestricted escalate --
  # not satisfiable by scoping escalate/bind to rbac.authorization.k8s.io
  # resources only, because aggregationRule composes rules dynamically via
  # label selector across whatever resources those rules end up covering.
  # Given the custom rule set was already accepted-risk equivalent to
  # cluster-admin for ordinary verbs, binding to the real cluster-admin
  # role is more honest than a hand-rolled near-duplicate that needs
  # patching every time a future chart hits the next escalation edge case.
  # roleRef is immutable on an existing ClusterRoleBinding -- Replace=true
  # makes Argo CD delete+recreate it instead of failing on that field.
  - patch: |
      - op: replace
        path: /subjects/0/namespace
        value: core-argocd
      - op: replace
        path: /roleRef/name
        value: cluster-admin
      - op: add
        path: /metadata/annotations
        value:
          argocd.argoproj.io/sync-options: Replace=true
    target:
      kind: ClusterRoleBinding
      name: argocd-application-controller
  - patch: |
      - op: replace
        path: /subjects/0/namespace
        value: core-argocd
    target:
      kind: ClusterRoleBinding
      name: argocd-applicationset-controller
  - patch: |
      - op: replace
        path: /subjects/0/namespace
        value: core-argocd
    target:
      kind: ClusterRoleBinding
      name: argocd-server
  - path: argocd-cm.yaml
    target:
      kind: ConfigMap
      name: argocd-cm
  - path: argocd-rbac-cm.yaml
    target:
      kind: ConfigMap
      name: argocd-rbac-cm
  - path: argocd-cmd-params-cm.yaml
    target:
      kind: ConfigMap
      name: argocd-cmd-params-cm
  # argocd-application-controller's own ClusterRole is left at the chart
  # default and unused now -- the ClusterRoleBinding above points at the
  # built-in cluster-admin role instead (see that patch's comment for why).
