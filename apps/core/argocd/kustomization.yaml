---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: core-argocd

resources:
  - namespace.yaml
  - networkpolicy.yaml
  - cilium-networkpolicy.yaml
  - httproute.yaml
  - homelab-ca-configmap.yaml
  - github.com/argoproj/argo-cd//manifests/cluster-install?ref=v3.5.3

openapi:
  path: https://raw.githubusercontent.com/argoproj/argo-schema-generator/main/schema/argo_all_k8s_kustomize_schema.json

patches:
  - path: patch-deployments.yaml
  - path: patch-statefulsets.yaml
  - path: patch-argocd-server-ca.yaml
    target:
      kind: Deployment
      name: argocd-server
  - path: patch-argocd-server-hostalias.yaml
    target:
      kind: Deployment
      name: argocd-server
  # Kustomize namespace transformer does not update subjects[].namespace in ClusterRoleBindings.
  # ArgoCD chart hardcodes namespace: argocd — patch all three to use the actual namespace.
  - patch: |
      - op: replace
        path: /subjects/0/namespace
        value: core-argocd
    target:
      kind: ClusterRoleBinding
      name: argocd-application-controller
  - patch: |
      - op: replace
        path: /subjects/0/namespace
        value: core-argocd
    target:
      kind: ClusterRoleBinding
      name: argocd-applicationset-controller
  - patch: |
      - op: replace
        path: /subjects/0/namespace
        value: core-argocd
    target:
      kind: ClusterRoleBinding
      name: argocd-server
  - path: argocd-cm.yaml
    target:
      kind: ConfigMap
      name: argocd-cm
  - path: argocd-rbac-cm.yaml
    target:
      kind: ConfigMap
      name: argocd-rbac-cm
  - path: argocd-cmd-params-cm.yaml
    target:
      kind: ConfigMap
      name: argocd-cmd-params-cm
  # Grant cluster-wide read/write to all resources.
  # Minimal-permission approach caused whack-a-mole RBAC failures as ArgoCD's
  # cluster cache discovery hits every API group. Single-node homelab has no
  # multi-tenant threat model that warrants the maintenance overhead.
  #
  # escalate/bind on rbac.authorization.k8s.io are deliberately separate from
  # the `*`/`*` wildcard above: Kubernetes' RBAC authorizer requires these
  # exact verb strings (not implied by create/patch/`*` resources) before
  # letting a principal create or update a ClusterRole with a non-nil
  # aggregationRule, or a RoleBinding/ClusterRoleBinding at all — a
  # defense-in-depth check against privilege escalation via broad grants,
  # independent of how wide the resource/verb wildcard otherwise is. Hit
  # this deploying Kyverno: its chart's per-controller ClusterRoles
  # (kyverno:background-controller etc.) use aggregationRule to compose
  # rules from labeled `:core` ClusterRoles, and every one failed with
  # "forbidden: must have cluster-admin privileges to use the
  # aggregationRule" even though the rule above already grants this
  # ServiceAccount full CRUD on ClusterRole/ClusterRoleBinding objects
  # directly — same accepted-risk reasoning as the wildcard grant itself.
  - patch: |
      - op: replace
        path: /rules
        value:
          - apiGroups: ["*"]
            resources: ["*"]
            verbs: [get, list, watch, create, update, patch, delete, deletecollection]
          - apiGroups: ["rbac.authorization.k8s.io"]
            resources: [clusterroles, clusterrolebindings, roles, rolebindings]
            verbs: [escalate, bind]
          - nonResourceURLs: ["*"]
            verbs: [get]
    target:
      kind: ClusterRole
      name: argocd-application-controller
