---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: core-argocd

resources:
  - namespace.yaml
  - networkpolicy.yaml
  - github.com/argoproj/argo-cd//manifests/cluster-install?ref=v3.3.8

openapi:
  path: https://raw.githubusercontent.com/argoproj/argo-schema-generator/main/schema/argo_all_k8s_kustomize_schema.json

patches:
  - path: patch-deployments.yaml
  - path: patch-statefulsets.yaml
  - path: argocd-cm.yaml
    target:
      kind: ConfigMap
      name: argocd-cm
  - patch: |
      - op: replace
        path: /rules
        value:
          # Core resources — full write for managed objects, nodes read-only
          - apiGroups: [""]
            resources: [pods, services, endpoints, configmaps, secrets, namespaces,
              serviceaccounts, events, resourcequotas, podtemplates,
              persistentvolumes, persistentvolumeclaims,
              replicationcontrollers, limitranges]
            verbs: [get, list, watch, create, update, patch, delete]
          - apiGroups: [""]
            resources: [nodes]
            verbs: [get, list, watch]
          # Apps
          - apiGroups: [apps]
            resources: [deployments, statefulsets, daemonsets, replicasets, controllerrevisions]
            verbs: [get, list, watch, create, update, patch, delete]
          # Batch
          - apiGroups: [batch]
            resources: [jobs, cronjobs]
            verbs: [get, list, watch, create, update, patch, delete]
          # Networking
          - apiGroups: [networking.k8s.io]
            resources: [ingresses, networkpolicies, ingressclasses]
            verbs: [get, list, watch, create, update, patch, delete]
          # RBAC — namespace-scoped write; cluster-scoped read-only
          - apiGroups: [rbac.authorization.k8s.io]
            resources: [roles, rolebindings]
            verbs: [get, list, watch, create, update, patch, delete]
          - apiGroups: [rbac.authorization.k8s.io]
            resources: [clusterroles, clusterrolebindings]
            verbs: [get, list, watch]
          # Policy
          - apiGroups: [policy]
            resources: [poddisruptionbudgets]
            verbs: [get, list, watch, create, update, patch, delete]
          # Coordination
          - apiGroups: [coordination.k8s.io]
            resources: [leases]
            verbs: [get, list, watch, create, update, patch, delete]
          # Storage — StorageClass, PV, CSIDriver managed by csi-driver-smb chart
          - apiGroups: [storage.k8s.io]
            resources: [storageclasses, volumeattachments, csidrivers, csinodes]
            verbs: [get, list, watch, create, update, patch, delete]
          # CRDs — installed via helmCharts with includeCRDs: true (Cilium, ESO)
          - apiGroups: [apiextensions.k8s.io]
            resources: [customresourcedefinitions]
            verbs: [get, list, watch, create, update, patch, delete]
          # Webhooks — ESO validating webhook
          - apiGroups: [admissionregistration.k8s.io]
            resources: [validatingwebhookconfigurations, mutatingwebhookconfigurations]
            verbs: [get, list, watch, create, update, patch, delete]
          # Autoscaling — read-only observation
          - apiGroups: [autoscaling]
            resources: [horizontalpodautoscalers]
            verbs: [get, list, watch]
          # ArgoCD own resources
          - apiGroups: [argoproj.io]
            resources: [applications, appprojects, applicationsets,
              applicationsets/finalizers, applicationsets/status]
            verbs: [get, list, watch, create, update, patch, delete]
          # Cilium — CiliumL2AnnouncementPolicy, CiliumLoadBalancerIPPool managed in git
          - apiGroups: [cilium.io]
            resources: ["*"]
            verbs: [get, list, watch, create, update, patch, delete]
          # External Secrets — ClusterSecretStore, ExternalSecret managed in git
          - apiGroups: [external-secrets.io]
            resources: ["*"]
            verbs: [get, list, watch, create, update, patch, delete]
          # Gateway API — future HTTPRoute/Gateway resources
          - apiGroups: [gateway.networking.k8s.io]
            resources: ["*"]
            verbs: [get, list, watch, create, update, patch, delete]
    target:
      kind: ClusterRole
      name: argocd-application-controller
