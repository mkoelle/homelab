---
# ExternalSecret -- merges the Authelia OIDC client secret (plaintext) into
# ArgoCD's own argocd-secret (creationPolicy: Merge adds/overwrites just this
# one key, leaves ArgoCD's own managed fields -- admin.password,
# server.secretkey, etc. -- untouched). argocd-cm.yaml's oidc.config
# references it via $argocd-secret:oidc.authelia.clientSecret.
#
# This must be the PLAINTEXT secret -- Authelia's own config
# (apps/core/authelia/values.yaml) stores a PBKDF2 hash of the same value for
# server-side verification; ArgoCD, as the OAuth2 client, needs the plaintext.
#
# Before applying: generate a random secret (openssl rand -base64 32), add it
# as a Bitwarden SM item, replace the UUID below. Then generate its PBKDF2
# hash for apps/core/authelia/secrets.yaml's
# oidc.clients.argocd.secret entry:
#   docker run --rm authelia/authelia:4.39.24 authelia crypto hash generate \
#     pbkdf2 --variant sha512 --no-confirm --password '<same-secret>'
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-oidc-secret
  namespace: core-argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  target:
    name: argocd-secret
    creationPolicy: Merge
  data:
    - secretKey: oidc.authelia.clientSecret
      remoteRef:
        key: "2b5e8abb-e6a6-4b56-a41b-b4cd01467734"
