---
# ExternalSecret -- merges the PocketID OIDC client secret into ArgoCD's own
# argocd-secret (creationPolicy: Merge adds/overwrites just this one key,
# leaves ArgoCD's own managed fields -- admin.password, server.secretkey,
# etc. -- untouched). argocd-cm.yaml's oidc.config references it via
# $argocd-secret:oidc.pocketid.clientSecret.
#
# Before applying: create an OIDC client in PocketID's admin UI (Settings ->
# OIDC Clients) named "ArgoCD", redirect URI
# https://argocd.motherbox.local/auth/callback, then:
#   1. put the client ID in argocd-cm.yaml's oidc.config
#   2. add a Bitwarden SM item with the client secret, replace the UUID below
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-oidc-secret
  namespace: core-argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  target:
    name: argocd-secret
    creationPolicy: Merge
  data:
    - secretKey: oidc.pocketid.clientSecret
      remoteRef:
        key: "<REPLACE-WITH-BSM-UUID-FOR-ARGOCD-OIDC-CLIENT-SECRET>"
