---
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-rbac-cm
data:
  # Deny all by default. Named roles must be explicitly granted.
  # Long-term: replace admin policy with Authentik OIDC group mappings.
  policy.default: role:''
  policy.csv: |
    p, role:admin, *, *, *, allow
    g, mkoelle@gmail.com, role:admin
    # Local "homepage" account (argocd-cm.yaml's accounts.homepage: apiKey)
    # -- role:readonly is one of ArgoCD's built-in roles (get-only across
    # all resources), no p, line needed to define it.
    g, homepage, role:readonly
  scopes: "[email]"
