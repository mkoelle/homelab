apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cmd-params-cm
data:
  server.insecure: "true"
  # "Apps in any namespace" -- lets Application/ApplicationSet objects live
  # outside core-argocd, in media-argocd (the homelab-media tenant, see
  # apps/.argocd/media.yaml). This is what makes the AppProject `media` an
  # actual boundary: Applications in media-argocd may only use projects whose
  # spec.sourceNamespaces lists media-argocd, so the homelab-media repo can't
  # write `project: homelab` and escape its fence.
  #
  # NOT hot-reloaded: after changing either key, restart the consumers:
  #   kubectl -n core-argocd rollout restart deploy/argocd-server \
  #     deploy/argocd-applicationset-controller sts/argocd-application-controller
  application.namespaces: media-argocd
  # Not used yet (homelab-media is a plain app-of-apps today) -- set now so
  # the tenant can add ApplicationSets later without a homelab change.
  applicationsetcontroller.namespaces: media-argocd
