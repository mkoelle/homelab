---
# Deny ingress from other namespaces. Intra-namespace traffic (server→redis,
# server→repo-server, controller→dex, etc.) is allowed by the podSelector rule.
# kubectl port-forward bypasses NetworkPolicy — UI access is unaffected.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-cross-namespace-ingress
  namespace: core-argocd
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
