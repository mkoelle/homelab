apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: core-argocd
data:
  url: https://argocd.motherbox.local
  kustomize.buildOptions: "--enable-helm"
  # SSO via Zitadel. client_id/OIDC app are declared in
  # apps/core/zitadel/terraform/main.tf (zitadel_application_oidc.argocd) --
  # Zitadel generates client_secret server-side, and that same Terraform
  # writes it straight into Secret zitadel-argocd-oidc-secret in this
  # namespace (no Bitwarden round-trip, no risk of the two sides
  # disagreeing). ArgoCD resolves $<secret-name>:<key> references from any
  # Secret in this namespace at runtime, does not need it inline here.
  #
  # clientID is hardcoded (not $secret:key) -- confirmed live that ArgoCD's
  # $secret:key substitution does NOT resolve for clientID specifically (it
  # left the literal `$zitadel-argocd-oidc-secret:clientId` string in the
  # outgoing /oauth/v2/authorize redirect, which Zitadel would reject as an
  # unknown client). This is the documented fallback this comment used to
  # describe as a contingency. A client_id is a public identifier, not
  # secret material, so committing it is fine -- unlike client_secret, which
  # stays in the Secret. Re-pull via `kubectl get secret
  # zitadel-argocd-oidc-secret -n core-argocd -o jsonpath='{.data.clientId}'
  # | base64 -d` if Terraform ever regenerates the Zitadel application.
  oidc.config: |
    name: Zitadel
    issuer: https://id.hl.mkoelle.com
    clientID: "392071902518050850"
    clientSecret: $zitadel-argocd-oidc-secret:clientSecret
    requestedScopes: ["openid", "profile", "email", "groups"]
  # Exclude API groups not managed by this cluster's GitOps manifests.
  # ArgoCD cluster cache sync fails if it cannot list any discovered API group.
  # resource.k8s.io (DRA) and flowcontrol are cluster-internal; snapshot.storage.k8s.io
  # is managed by the CSI driver directly, not via GitOps.
  resource.exclusions: |
    - apiGroups:
        - "resource.k8s.io"
      kinds:
        - "*"
      clusters:
        - "*"
    - apiGroups:
        - "flowcontrol.apiserver.k8s.io"
      kinds:
        - "*"
      clusters:
        - "*"
    - apiGroups:
        - "snapshot.storage.k8s.io"
      kinds:
        - "*"
      clusters:
        - "*"
