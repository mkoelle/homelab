---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: homelab
  namespace: gateway
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  gatewayClassName: cilium
  listeners:
    # Plain HTTP only redirects to HTTPS (http-redirect.yaml). Restricted to
    # this namespace so app HTTPRoutes without a sectionName attach to the
    # HTTPS listeners only -- otherwise their exact hostnames would outrank the
    # hostname-less redirect route and keep serving apps over HTTP (which
    # broke ArgoCD's OIDC login: return_url=http://... vs url https://...).
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
    # Every homelab app is served here, under a publicly-trusted Let's
    # Encrypt wildcard (hl-mkoelle-com-cert.yaml). It started as the home
    # for apps needing a real cert (Google's OAuth console rejects .local
    # redirect URIs); the old *.motherbox.local listener and its
    # self-signed wildcard cert have since been retired. Any future
    # app.hl.mkoelle.com HTTPRoute matches this listener -- no new listener
    # per app, and no app name ever appears in Certificate Transparency.
    - name: https-hl
      hostname: "*.hl.mkoelle.com"
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: hl-mkoelle-com-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              gateway-access: "true"
    # homelab-media tenant listener (ADR 0008). The tenant's `media`
    # namespace has no gateway-access label, so this is the ONLY listener its
    # HTTPRoutes can attach to -- and Gateway API only accepts a route whose
    # hostnames fall under the listener's, so the tenant can serve
    # *.media.hl.mkoelle.com and nothing else (it can't claim
    # id.hl.mkoelle.com, argocd.hl.mkoelle.com, ...). Selected by
    # kubernetes.io/metadata.name, which the API server sets and the tenant
    # can't forge. New media hostnames need no change here.
    - name: https-media
      hostname: "*.media.hl.mkoelle.com"
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: media-hl-mkoelle-com-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: media
