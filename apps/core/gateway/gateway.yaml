---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: homelab
  namespace: gateway
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  gatewayClassName: cilium
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              gateway-access: "true"
    - name: https
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: motherbox-wildcard-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              gateway-access: "true"
    # Separate listener, same port 443 (SNI-distinguished): *.hl.mkoelle.com
    # is the reserved subdomain for homelab apps needing a real
    # publicly-trusted cert (Google's OAuth console rejects redirect URIs on
    # .local -- see hl-mkoelle-com-cert.yaml), so it can't share the wildcard
    # listener's self-signed-CA cert above. Wildcard hostname here too: any
    # future app.hl.mkoelle.com HTTPRoute matches this same listener, no new
    # listener needed per app.
    - name: https-hl
      hostname: "*.hl.mkoelle.com"
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: hl-mkoelle-com-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              gateway-access: "true"
