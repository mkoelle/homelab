---
# Keep the aggregated API and internal scanners reachable within the namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kubescape-policy
  namespace: kubescape
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
---
# The APIService backend is reached by kube-apiserver from kube-system. The
# companion CiliumNetworkPolicy in cilium-networkpolicy.yaml narrows the
# source to the apiserver identity only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kubescape-storage-apiserver
  namespace: kubescape
spec:
  podSelector:
    matchLabels:
      app: storage
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: TCP
          port: 8443
---
# Alloy scrapes only the separate Prometheus exporter Deployment.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kubescape-metrics
  namespace: kubescape
spec:
  podSelector:
    matchLabels:
      app: prometheus-exporter
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: alloy
      ports:
        - protocol: TCP
          port: 8080
