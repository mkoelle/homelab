---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kubescape

resources:
  - namespace.yaml
  - networkpolicy.yaml
  - cilium-networkpolicy.yaml

helmCharts:
  - name: kubescape-operator
    repo: https://kubescape.github.io/helm-charts/
    version: 1.40.4
    releaseName: kubescape
    namespace: kubescape
    includeCRDs: true
    valuesFile: values.yaml
