---
# Ingress-only: Alloy scrapes /metrics on 9003. OpenCost's own UI (9090) now
# also gets an HTTPRoute, via its own oauth2-proxy SSO front door
# (oauth2-proxy-values.yaml) -- reverses the original scope-minimization
# call (Grafana dashboards were the intended path, port-forward for ad-hoc
# access) at the user's request.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: opencost-policy
  namespace: opencost
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: alloy
      ports:
        - protocol: TCP
          port: 9003
    # oauth2-proxy -> OpenCost's own UI. podSelector: {} above already
    # covers OpenCost's own pod, so same-namespace traffic isn't implicitly
    # allowed -- confirmed live (502 "dial tcp ...:9090: i/o timeout" from
    # oauth2-proxy, a policy drop, not a real connection refusal).
    - from:
        - podSelector:
            matchLabels:
              app: opencost-oauth2-proxy
      ports:
        - protocol: TCP
          port: 9090
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: opencost-oauth2-proxy-policy
  namespace: opencost
spec:
  podSelector:
    matchLabels:
      app: opencost-oauth2-proxy
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gateway
      ports:
        - protocol: TCP
          port: 4180
