---
# Alloy's generic pod-annotation discovery (apps/core/alloy/values.yaml's
# pod_metrics scrape) picks this up automatically -- no per-app Alloy
# config needed, unlike Uptime Kuma which needs its own dedicated scrape
# block for auth.
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "9003"

# Chart defaults every securityContext to `{}` -- doesn't satisfy this
# namespace's pod-security.kubernetes.io/enforce: restricted label
# (namespace.yaml). Two containers in one pod (opencost + opencost-ui, an
# nginx sidecar), each needs its own securityContext key.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

opencost:
  # Chart defaults to a nonexistent prometheus-server.prometheus-system --
  # this cluster's metrics store is VictoriaMetrics (apps/core/monitoring),
  # which speaks the same Prometheus query API on the same Service other
  # consumers (Grafana's datasource, vmalert) already use successfully.
  prometheus:
    internal:
      enabled: true
      serviceName: vmsingle-victoria-metrics-single-server
      namespaceName: monitoring
      port: 8428
  # kube-state-metrics runs in apps/core/monitoring, so OpenCost must not
  # re-export its own copies of the same kube_* series -- they double every
  # sum() on the Kubernetes dashboards (e.g. Running Containers 78 -> 158).
  # emitKsmV1MetricsOnly keeps just the v1 metrics KSM 2 no longer ships,
  # per OpenCost's guidance for clusters that already run KSM.
  metrics:
    kubeStateMetrics:
      emitKsmV1Metrics: false
      emitKsmV1MetricsOnly: true
  # On-prem node, no cloud pricing API. Without customPricing, OpenCost
  # tries to write its pricing file to /var/configs, which the non-root
  # exporter (uid 1000) can't create ("mkdir /var/configs: permission
  # denied") -- so it never loads pricing, never emits
  # node_{cpu,ram,total}_hourly_cost, and node/asset costs read as 0.
  # Enabling this points CONFIG_PATH at a writable emptyDir and loads the
  # rates below. Values are hourly (per vCPU, per GiB RAM, per GiB storage)
  # and match OpenCost's shipped on-prem defaults (default.json) -- tune
  # them to real hardware/power cost if exact numbers matter.
  customPricing:
    enabled: true
    costModel:
      description: Homelab on-prem pricing (OpenCost default.json rates)
      CPU: 0.031611
      spotCPU: 0.006655
      RAM: 0.004237
      spotRAM: 0.000892
      GPU: 0.95
      storage: "0.00005479452"
      zoneNetworkEgress: 0.01
      regionNetworkEgress: 0.01
      internetNetworkEgress: 0.12
  exporter:
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
      runAsNonRoot: true
      runAsUser: 1000
    resources:
      requests:
        memory: "256Mi"
        cpu: "100m"
      limits:
        memory: "1Gi"
        cpu: "1000m"
  ui:
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
      runAsNonRoot: true
      # 1001, not 1000 -- the image's own baked-in user, confirmed live via
      # `podman inspect`/`id`: it owns /var/www, which the container's
      # startup script sed-rewrites (BASE_URL injection). Any other UID hits
      # "Permission denied" on that write -- confirmed live too.
      runAsUser: 1001
