nameOverride: opencost-oauth2-proxy
fullnameOverride: opencost-oauth2-proxy

config:
  existingSecret: opencost-oauth2-proxy-secret
  upstreams:
    - http://opencost.opencost.svc.cluster.local:9090/

extraArgs:
  provider: oidc
  oidc-issuer-url: https://id.hl.mkoelle.com
  redirect-url: https://opencost.motherbox.local/oauth2/callback
  cookie-secure: "true"
  skip-provider-button: "true"

resources:
  requests:
    memory: "64Mi"
    cpu: "50m"
  limits:
    memory: "128Mi"
    cpu: "500m"

gatewayApi:
  enabled: true
  gatewayRef:
    name: homelab
    namespace: gateway
  hostnames:
    - opencost.motherbox.local

networkPolicy:
  create: false # this app's own networkpolicy.yaml/cilium-networkpolicy.yaml cover it
