---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: opencost

resources:
  - namespace.yaml
  - networkpolicy.yaml
  - cilium-networkpolicy.yaml

helmCharts:
  - name: opencost
    repo: https://opencost.github.io/opencost-helm-chart/
    version: 2.5.32
    releaseName: opencost
    namespace: opencost
    includeCRDs: false
    valuesFile: values.yaml
  # SSO front door for OpenCost's own UI (oauth2-proxy-values.yaml) --
  # OpenCost has no native OIDC support.
  - name: oauth2-proxy
    repo: https://oauth2-proxy.github.io/manifests
    version: 10.7.0
    releaseName: opencost-oauth2-proxy
    namespace: opencost
    valuesFile: oauth2-proxy-values.yaml
