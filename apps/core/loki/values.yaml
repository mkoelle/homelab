---
# Loki — single-binary mode, filesystem storage, no gateway (nginx) since there's
# only one binary to route to anyway. No PVC — falls back to emptyDir (ephemeral,
# same tradeoff as monitoring/values.yaml: log history lost on pod restart).
deploymentMode: SingleBinary

loki:
  # Chart default omits seccompProfile — required by this namespace's
  # pod-security.kubernetes.io/enforce: restricted label (namespace.yaml).
  podSecurityContext:
    fsGroup: 10001
    fsGroupChangePolicy: OnRootMismatch
    runAsGroup: 10001
    runAsNonRoot: true
    runAsUser: 10001
    seccompProfile:
      type: RuntimeDefault
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  compactor:
    retention_enabled: true
    delete_request_store: filesystem
  limits_config:
    retention_period: 168h # 7d — matches Prometheus's 3d in spirit; irrelevant while storage is ephemeral

singleBinary:
  replicas: 1
  persistence:
    enabled: false
  # persistence.enabled: false means no /var/loki mount at all (not an emptyDir
  # fallback, as originally assumed here) -- confirmed against the chart's own
  # single-binary/statefulset.yaml, the storage volumeMount is conditional on
  # persistence.enabled with no else-branch. Without this, Loki can't even
  # start ("mkdir /var/loki: read-only file system").
  extraVolumes:
    - name: data
      emptyDir: {}
  extraVolumeMounts:
    - name: data
      mountPath: /var/loki
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "1Gi"
      cpu: "1000m"

# Distributed-mode components — unused in SingleBinary deployment mode.
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0

gateway:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false
chunksCache:
  enabled: false
resultsCache:
  enabled: false
monitoring:
  serviceMonitor:
    enabled: false
  selfMonitoring:
    enabled: false
  lokiCanary:
    enabled: false
