---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: loki

resources:
  - namespace.yaml
  - networkpolicy.yaml

helmCharts:
  - name: loki
    repo: https://grafana.github.io/helm-charts
    version: 7.0.0
    releaseName: loki
    namespace: loki
    includeCRDs: true
    valuesFile: values.yaml
