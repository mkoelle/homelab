---
# Ingress-only, matching apps/core/monitoring/networkpolicy.yaml's reasoning:
# only Grafana (queries) and Alloy (log pushes, cluster-wide DaemonSet) may reach Loki.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: loki-policy
  namespace: loki
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: alloy
      ports:
        - protocol: TCP
          port: 3100
