nameOverride: homepage-oauth2-proxy
fullnameOverride: homepage-oauth2-proxy

config:
  existingSecret: homepage-oauth2-proxy-secret
  upstreams:
    - http://homepage.homepage.svc.cluster.local:80/

extraArgs:
  provider: oidc
  oidc-issuer-url: https://id.hl.mkoelle.com
  redirect-url: https://homepage.motherbox.local/oauth2/callback
  cookie-secure: "true"
  skip-provider-button: "true"

resources:
  requests:
    memory: "64Mi"
    cpu: "50m"
  limits:
    memory: "128Mi"
    cpu: "500m"

gatewayApi:
  enabled: true
  gatewayRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: homelab
    namespace: gateway
  hostnames:
    - homepage.motherbox.local
  # Explicit weight/group/kind -- the chart's own defaults omit them, but
  # the Gateway API CRD defaults them server-side, which ArgoCD's diff then
  # sees as permanent drift (learned live getting Hubble/Alloy/OpenCost's
  # HTTPRoutes to actually reach Synced).
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: homepage-oauth2-proxy
          port: 80
          weight: 1

networkPolicy:
  create: false # this app's own networkpolicy.yaml/cilium-networkpolicy.yaml cover it
