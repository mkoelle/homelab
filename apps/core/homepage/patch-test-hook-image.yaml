---
# Chart's own Helm test hook (helm.sh/hook: test, never runs during a
# normal ArgoCD sync) pins no tag on its busybox image -- trips
# kube-linter's latest-tag check. Pinning it here rather than disabling
# the check, same fix as apps/core/uptime-kuma/patch-test-hook-image.yaml.
apiVersion: v1
kind: Pod
metadata:
  name: homepage-test-connection
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: wget
      image: busybox:1.36.1
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
