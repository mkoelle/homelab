---
# Ingress-only, from the oauth2-proxy pod only (SSO front door,
# oauth2-proxy-values.yaml) -- Homepage itself makes no outbound calls that
# need an egress allowance (static services.yaml, no k8s auto-discovery
# since rbac.enabled: false in values.yaml).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: homepage-policy
  namespace: homepage
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: homepage-oauth2-proxy
      ports:
        - protocol: TCP
          port: 3000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: homepage-oauth2-proxy-policy
  namespace: homepage
spec:
  podSelector:
    matchLabels:
      app: homepage-oauth2-proxy
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gateway
      ports:
        - protocol: TCP
          port: 4180
