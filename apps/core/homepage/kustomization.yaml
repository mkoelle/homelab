---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: homepage

resources:
  - namespace.yaml
  - networkpolicy.yaml
  - cilium-networkpolicy.yaml

# Content-hash suffix, not a static configmap.yaml -- subPath-mounted
# ConfigMap keys (values.yaml's volumeMounts) never auto-update on a plain
# ConfigMap's content change (documented kubelet limitation: subPath breaks
# the normal watch-based volume refresh). Confirmed live: editing icon names
# updated the ConfigMap object but the running pod kept serving stale
# mounted files until manually restarted. A generated name changes on every
# content edit, which changes the Deployment's volume reference too (via
# kustomize's nameReference transformer), forcing an actual rollout instead
# -- same pattern already used for zitadel-terraform-files
# (apps/core/zitadel/kustomization.yaml).
# Content-hashed names leave the previous ConfigMap behind on every change,
# and with prune off (repo convention) Argo flags it "requires pruning" --
# app permanently OutOfSync. IgnoreExtraneous makes such leftovers not count
# toward sync status; they're tiny and harmless. Clean up by hand if wanted:
# kubectl -n <ns> delete cm <old-hashed-name>.
generatorOptions:
  annotations:
    argocd.argoproj.io/compare-options: IgnoreExtraneous
configMapGenerator:
  - name: homepage-config
    files:
      - settings.yaml
      - services.yaml
      - bookmarks.yaml
      - widgets.yaml
      - docker.yaml

helmCharts:
  - name: homepage
    repo: oci://ghcr.io/m0nsterrr/helm-charts
    version: 5.4.0
    releaseName: homepage
    namespace: homepage
    valuesFile: values.yaml
  # SSO front door for Homepage (oauth2-proxy-values.yaml) -- Homepage has
  # no native OIDC support.
  - name: oauth2-proxy
    repo: https://oauth2-proxy.github.io/manifests
    version: 10.7.0
    releaseName: homepage-oauth2-proxy
    namespace: homepage
    valuesFile: oauth2-proxy-values.yaml

patches:
  - path: patch-test-hook-image.yaml
    target:
      kind: Pod
      name: homepage-test-connection
