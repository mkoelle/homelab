---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: homepage

resources:
  - namespace.yaml
  - configmap.yaml
  - networkpolicy.yaml
  - cilium-networkpolicy.yaml

helmCharts:
  - name: homepage
    repo: oci://ghcr.io/m0nsterrr/helm-charts
    version: 5.4.0
    releaseName: homepage
    namespace: homepage
    valuesFile: values.yaml
  # SSO front door for Homepage (oauth2-proxy-values.yaml) -- Homepage has
  # no native OIDC support.
  - name: oauth2-proxy
    repo: https://oauth2-proxy.github.io/manifests
    version: 10.7.0
    releaseName: homepage-oauth2-proxy
    namespace: homepage
    valuesFile: oauth2-proxy-values.yaml

patches:
  - path: patch-test-hook-image.yaml
    target:
      kind: Pod
      name: homepage-test-connection
