---
# No dynamic StorageClass on this cluster (apps/core/storage only has the
# static pre-provisioned photos-pv) -- same ephemeral-storage tradeoff
# already accepted for Loki/VictoriaMetrics: monitor history/config lost on
# pod restart. Chart's own volume.enabled=true wants a real PVC via a
# dynamic provisioner that doesn't exist here.
volume:
  enabled: false
additionalVolumes:
  - name: data
    emptyDir: {}
additionalVolumeMounts:
  - name: data
    mountPath: /app/data

# Chart defaults both contexts to `{}` -- doesn't satisfy this namespace's
# pod-security.kubernetes.io/enforce: restricted label (namespace.yaml).
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]

resources:
  requests:
    memory: "256Mi"
    cpu: "100m"
  limits:
    memory: "1Gi"
    cpu: "1000m"
