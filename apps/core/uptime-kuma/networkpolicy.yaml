---
# Ingress-only, same reasoning as apps/core/loki/networkpolicy.yaml: only
# Grafana (its own UI is reached via Gateway, see cilium-networkpolicy.yaml)
# and Alloy (scraping /metrics) need to reach this namespace directly.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: uptime-kuma-policy
  namespace: uptime-kuma
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: alloy
      ports:
        - protocol: TCP
          port: 3001
