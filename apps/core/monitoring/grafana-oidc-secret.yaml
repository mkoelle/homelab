---
# ExternalSecret -- pulls the PocketID OIDC client secret for Grafana from
# Bitwarden Secrets Manager. See values-grafana.yaml's envValueFrom.
#
# Before applying: add a Bitwarden SM item with the client secret generated
# when creating Grafana's OIDC client in PocketID, replace the UUID below.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-oidc
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  target:
    name: grafana-oidc
    creationPolicy: Owner
  data:
    - secretKey: client-secret
      remoteRef:
        key: "<REPLACE-WITH-BSM-UUID-FOR-GRAFANA-OIDC-CLIENT-SECRET>"
