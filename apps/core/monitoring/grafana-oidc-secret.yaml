---
# ExternalSecret -- pulls the plaintext Authelia OIDC client secret for
# Grafana from Bitwarden Secrets Manager. See values-grafana.yaml's
# envValueFrom. Authelia's own config
# (apps/core/authelia/secrets.yaml's oidc.clients.grafana.secret) stores a
# PBKDF2 hash of this same value for server-side verification.
#
# Before applying: generate a random secret (openssl rand -base64 32), add it
# as a Bitwarden SM item, replace the UUID below. Then generate its PBKDF2
# hash for apps/core/authelia/secrets.yaml:
#   docker run --rm authelia/authelia:4.39.24 authelia crypto hash generate \
#     pbkdf2 --variant sha512 --no-confirm --password '<same-secret>'
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-oidc
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  target:
    name: grafana-oidc
    creationPolicy: Owner
  data:
    - secretKey: client-secret
      remoteRef:
        key: "<REPLACE-WITH-BSM-UUID-FOR-GRAFANA-OIDC-CLIENT-SECRET>"
