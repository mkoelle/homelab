---
admin:
  existingSecret: grafana-admin
  userKey: admin-user
  passwordKey: admin-password
persistence:
  enabled: false
testFramework:
  enabled: false
ingress:
  enabled: false # exposed via Gateway API HTTPRoute instead, see httproute.yaml
sidecar:
  dashboards:
    enabled: true
  datasources:
    enabled: true
# Grafana Logs Drilldown (grafana-lokiexplore-app) -- queryless, field/
# pattern-filterable log browsing on top of Loki, an official Grafana Labs
# plugin (on the catalog, unlike OpenObserve's -- no unsigned-plugin
# tradeoff). Gets the Kibana/OpenSearch-Dashboards-style Discover-tab
# experience without leaving Grafana, so it inherits Zitadel SSO for free --
# the reason OpenObserve got tried and dropped: its OSS edition has no SSO
# at all (Enterprise/Cloud only), and its plugin wasn't installable cleanly
# anyway. Needs Grafana >=11.6.0 and Loki >=3.2 -- this repo runs 12.3.1 and
# 3.6.12 (chart appVersions), comfortably past both.
plugins:
  - grafana-lokiexplore-app
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: VictoriaMetrics
        type: prometheus
        access: proxy
        url: http://vmsingle-victoria-metrics-single-server.monitoring.svc.cluster.local:8428
        isDefault: true
      - name: Loki
        type: loki
        access: proxy
        url: http://loki.loki.svc.cluster.local:3100
resources:
  requests:
    memory: "128Mi"
    cpu: "100m"
  limits:
    memory: "512Mi"
    cpu: "500m"

# SSO via Zitadel. The OIDC app is declared in
# apps/core/zitadel/terraform/main.tf (zitadel_application_oidc.grafana) --
# Zitadel generates client_id/client_secret server-side, and that same
# Terraform writes both straight into Secret zitadel-grafana-oidc-secret in
# this namespace (no Bitwarden round-trip). Grafana's generic_oauth provider
# has no issuer-based discovery, so each endpoint is spelled out -- these are
# Zitadel's documented conventional paths, NOT yet confirmed live -- verify
# against https://id.hl.mkoelle.com/.well-known/openid-configuration once
# deployed and fix here if they don't match (same caution this comment
# carried for Authelia before it).
env:
  GF_SERVER_ROOT_URL: "https://grafana.motherbox.local"
  GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
  GF_AUTH_GENERIC_OAUTH_NAME: "Zitadel"
  GF_AUTH_GENERIC_OAUTH_SCOPES: "openid profile email"
  GF_AUTH_GENERIC_OAUTH_AUTH_URL: "https://id.hl.mkoelle.com/oauth/v2/authorize"
  GF_AUTH_GENERIC_OAUTH_TOKEN_URL: "https://id.hl.mkoelle.com/oauth/v2/token"
  GF_AUTH_GENERIC_OAUTH_API_URL: "https://id.hl.mkoelle.com/oidc/v1/userinfo"
  GF_AUTH_GENERIC_OAUTH_USE_PKCE: "true"
  GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP: "true"
  # No role_attribute_path claim mapping from Zitadel -- with none set,
  # newly-provisioned OIDC users get GF_USERS_AUTO_ASSIGN_ORG_ROLE's value
  # (Grafana's own default there is "Viewer", which hides Explore/
  # Administration entirely -- confirmed live). Single-admin homelab, one
  # real Zitadel user: Admin for everyone who can log in at all is the
  # correct trust model here, matching every other single-user app in this
  # repo, not a broad grant.
  GF_USERS_AUTO_ASSIGN_ORG_ROLE: "Admin"
envValueFrom:
  GF_AUTH_GENERIC_OAUTH_CLIENT_ID:
    secretKeyRef:
      name: zitadel-grafana-oidc-secret
      key: client-id
  GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
    secretKeyRef:
      name: zitadel-grafana-oidc-secret
      key: client-secret
