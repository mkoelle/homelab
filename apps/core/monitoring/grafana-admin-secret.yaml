---
# ExternalSecret — pulls Grafana admin credentials from Bitwarden Secrets Manager.
#
# Deliberately targets the monitoring namespace (not core-secrets): Grafana reads
# admin.existingSecret as a same-namespace Secret volume/env reference, unlike the SMB
# credentials which use the CSI driver's cross-namespace nodeStageSecretRef.
#
# Before applying: add a Bitwarden Secrets Manager item with username/password and
# replace the UUIDs below with their BSM IDs.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  target:
    name: grafana-admin
    creationPolicy: Owner
  data:
    - secretKey: admin-user
      remoteRef:
        key: "REPLACE-WITH-BSM-ID"
    - secretKey: admin-password
      remoteRef:
        key: "REPLACE-WITH-BSM-ID"
