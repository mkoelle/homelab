---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring

resources:
  - namespace.yaml
  - networkpolicy.yaml
  - cilium-networkpolicy.yaml
  - grafana-admin-secret.yaml
  - httproute.yaml
  - dashboards/node-exporter-full.yaml
  - dashboards/kubernetes-cluster.yaml
  - dashboards/argocd.yaml
  - dashboards/cilium.yaml
  - dashboards/opencost-overview.yaml
  - dashboards/opencost-workload.yaml
  - dashboards/uptime-kuma.yaml
  - dashboards/trivy-operator.yaml
  - dashboards/kubescape.yaml

helmCharts:
  - name: victoria-metrics-single
    repo: https://victoriametrics.github.io/helm-charts
    version: 0.47.0
    releaseName: vmsingle
    namespace: monitoring
    includeCRDs: false
    valuesFile: values-vmsingle.yaml
  - name: victoria-metrics-alert
    repo: https://victoriametrics.github.io/helm-charts
    version: 0.49.0
    releaseName: vmalert
    namespace: monitoring
    includeCRDs: false
    valuesFile: values-vmalert.yaml
  - name: kube-state-metrics
    repo: https://prometheus-community.github.io/helm-charts
    version: 8.5.0
    releaseName: kube-state-metrics
    namespace: monitoring
    includeCRDs: false
    valuesFile: values-kube-state-metrics.yaml
  # kube-system, not monitoring: node-exporter needs hostNetwork/hostPID/hostPath
  # to read host /proc, /sys -- flatly incompatible with the monitoring
  # namespace's pod-security.kubernetes.io/enforce: restricted label (no values
  # override can satisfy both; PodSecurity "restricted" forbids these outright).
  # kube-system already hosts Cilium and csi-driver-smb, the other
  # host-level-access components in this cluster -- same precedent.
  - name: prometheus-node-exporter
    repo: https://prometheus-community.github.io/helm-charts
    version: 4.57.0
    releaseName: node-exporter
    namespace: kube-system
    includeCRDs: false
    valuesFile: values-node-exporter.yaml
  - name: grafana
    repo: https://grafana.github.io/helm-charts
    version: 10.5.15
    releaseName: grafana
    namespace: monitoring
    includeCRDs: false
    valuesFile: values-grafana.yaml
