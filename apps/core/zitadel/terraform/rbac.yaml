# Same, for main.tf's kubernetes_secret.{sonarr,radarr,lidarr}_oauth2_proxy,
# all three in the homelab-media tenant's `media` namespace -- the tenant
# can't create these itself (docs/adrs/0008-multi-repo-tenancy.md), hence
# terraform owning them here instead. One Role covers all three secret
# names: RBAC can't resourceName-scope create, same as every Role above.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: zitadel-terraform-oidc-secret
  namespace: media
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: zitadel-terraform-oidc-secret
  namespace: media
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: zitadel-terraform-oidc-secret
subjects:
  - kind: ServiceAccount
    name: zitadel-terraform
    namespace: zitadel
---
# Same, for main.tf's kubernetes_secret.sftpgo_oidc in ns sftpgo
# (originally the viewer password secret, now SSO). Missing when
# sftpgo replaced filebrowser (#60): every terraform apply failed with
# "cannot create resource secrets ... in the namespace sftpgo", and the
# sftpgo pod sat in CreateContainerConfigError waiting for the Secret.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: zitadel-terraform-oidc-secret
  namespace: sftpgo
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: zitadel-terraform-oidc-secret
  namespace: sftpgo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: zitadel-terraform-oidc-secret
subjects:
  - kind: ServiceAccount
    name: zitadel-terraform
    namespace: zitadel
