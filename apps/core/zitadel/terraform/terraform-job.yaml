---
# This repo's first PostSync hook. Runs after the zitadel Helm release syncs,
# waits for the app to actually answer healthz (PostSync only guarantees
# resources were applied, not that Zitadel finished DB migration/startup),
# then applies main.tf. hook-delete-policy replaces the Job each sync --
# combined with configMapGenerator's content-hash suffix on the .tf files
# ConfigMap (kustomization.yaml), this re-runs exactly when .tf content
# changes, not on every unrelated sync.
#
# No CA-trust mount needed for id.hl.mkoelle.com or Google's APIs -- both serve
# publicly-trusted certs (Let's Encrypt / Google's own), unlike Authelia's
# internal ca-issuer cert this replaces.
apiVersion: batch/v1
kind: Job
metadata:
  name: zitadel-terraform-apply
  namespace: zitadel
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 300
  template:
    spec:
      serviceAccountName: zitadel-terraform
      restartPolicy: Never
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: terraform
          image: hashicorp/terraform:1.9.8
          env:
            - name: HOME
              value: /workspace
          command:
            - sh
            - -c
            - |
              set -eu
              mkdir -p /workspace
              cp /tf-src/*.tf /workspace/
              cd /workspace

              echo "waiting for https://id.hl.mkoelle.com/debug/healthz ..."
              until wget -q -O /dev/null https://id.hl.mkoelle.com/debug/healthz; do
                sleep 5
              done
              echo "zitadel is healthy, applying terraform"

              terraform init
              terraform apply -auto-approve
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: tf-src
              mountPath: /tf-src
              readOnly: true
            - name: workspace
              mountPath: /workspace
            - name: tmp
              mountPath: /tmp
            - name: zitadel-jwt
              mountPath: /var/run/secrets/zitadel
              readOnly: true
            - name: google-oauth
              mountPath: /var/run/secrets/google-oauth
              readOnly: true
      volumes:
        - name: tf-src
          configMap:
            name: zitadel-terraform-files
        - name: workspace
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        # Auto-created by the zitadel chart's setup Job -- see
        # values.yaml's FirstInstance.Org.Machine.MachineKey. NOT the
        # sibling terraform-runner-pat Secret: the zitadel provider at the
        # pinned v1.2.0 has no raw-bearer-token argument at all -- `token`
        # (confirmed against zitadel/helper/client.go at that tag) routes
        # through middleware.JWTProfileFromPath, i.e. it wants this JWT
        # Profile machine-key JSON, not a PAT. Passing the PAT there fails
        # with "invalid character 'e' looking for beginning of value" (json
        # parsing plain-text PAT content). See provider.tf.
        - name: zitadel-jwt
          secret:
            secretName: terraform-runner
        - name: google-oauth
          secret:
            secretName: google-oauth-client-secret
