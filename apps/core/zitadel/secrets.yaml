---
# ExternalSecret -- Zitadel's symmetric encryption key. Referenced by
# values.yaml's zitadel.masterkeySecretName. Loss of this key means loss of
# all encrypted data (private keys, tokens) -- back up the Bitwarden item.
#
# Before applying: generate 32 bytes
#   (tr -dc A-Za-z0-9 </dev/urandom | head -c 32), add as a Bitwarden SM
# item, replace the UUID below.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zitadel-masterkey
  namespace: zitadel
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  target:
    name: zitadel-masterkey
    creationPolicy: Owner
  data:
    - secretKey: masterkey
      remoteRef:
        key: "9e6457dc-a1d1-4a89-b0e8-b4cd0146c01b" # auth/zitadel/masterkey -- gitleaks:allow, BSM item reference, not a secret
---
# ExternalSecret -- Postgres credentials in the shape the Bitnami postgresql
# subchart's auth.existingSecret expects (its own default secretKeys:
# postgres-password for the admin user, password for the app user -- see
# values.yaml's postgresql.auth block). Separate mechanism from Zitadel's own
# secretConfig below -- same underlying Bitwarden values, materialized twice
# because each chart wants a different Secret shape.
#
# Before applying: generate two random passwords, add as Bitwarden SM items,
# replace the UUIDs below.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zitadel-postgres-creds
  namespace: zitadel
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  target:
    name: zitadel-postgres-creds
    creationPolicy: Owner
  data:
    - secretKey: postgres-password
      remoteRef:
        key: "206482f7-604e-473a-b44c-b4cd014709d0" # auth/zitadel/postgres-admin-password -- gitleaks:allow, BSM item reference, not a secret
    - secretKey: password
      remoteRef:
        key: "f878dfed-4b12-4090-b889-b4cd0114578f" # auth/zitadel/postgres-user-password -- gitleaks:allow, BSM item reference, not a secret
---
# ExternalSecret -- Zitadel's own sensitive config, mounted via
# values.yaml's zitadel.configSecretName and merged with configmapConfig at
# startup (per the chart's own documented mechanism -- see values.yaml's
# configSecretName comment). Carries the SAME two Postgres passwords as
# zitadel-postgres-creds above (so Zitadel's DB client and Postgres's own
# auth agree) plus the bootstrap human admin's password -- FirstInstance.Org
# .Human.Password is sensitive and must NOT go in configmapConfig (that
# renders to a plain ConfigMap).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zitadel-secret-config
  namespace: zitadel
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  target:
    name: zitadel-secret-config
    creationPolicy: Owner
    template:
      data:
        config-yaml: |
          Database:
            postgres:
              User:
                Password: "{{ .dbUserPassword }}"
              Admin:
                Password: "{{ .dbAdminPassword }}"
          FirstInstance:
            Org:
              Human:
                Password: "{{ .adminPassword }}"
  data:
    - secretKey: dbUserPassword
      remoteRef:
        key: "f878dfed-4b12-4090-b889-b4cd0114578f" # auth/zitadel/postgres-user-password -- gitleaks:allow, same BSM item as zitadel-postgres-creds' "password" key
    - secretKey: dbAdminPassword
      remoteRef:
        key: "206482f7-604e-473a-b44c-b4cd014709d0" # auth/zitadel/postgres-admin-password -- gitleaks:allow, same BSM item as zitadel-postgres-creds' "postgres-password" key
    - secretKey: adminPassword
      remoteRef:
        key: "061936d3-3858-476a-a514-b4cd01474e57" # auth/zitadel/admin-password -- gitleaks:allow, BSM item reference, not a secret
---
# ExternalSecret -- Google OAuth client for "Sign in with Google" federation.
# Mounted into terraform-job.yaml, consumed by terraform/main.tf's
# zitadel_org_idp_google resource.
#
# Before applying: Google Cloud Console -> OAuth consent screen (External,
# Production -- default scopes need no verification review) -> Credentials ->
# Create OAuth client ID (Web application) -> redirect URI
# https://id.hl.mkoelle.com/idps/callback. Add both values as Bitwarden SM
# items, replace the UUIDs below.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: google-oauth-client-secret
  namespace: zitadel
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  target:
    name: google-oauth-client-secret
    creationPolicy: Owner
  data:
    - secretKey: client-id
      remoteRef:
        key: "2ca54239-db03-45ca-841a-b4cd01460ab4" # auth/zitadel/google-oauth-client-id -- gitleaks:allow, BSM item reference, not a secret
    - secretKey: client-secret
      remoteRef:
        key: "8c8a5f3e-5ec5-4861-a301-b4cd0146366c" # auth/zitadel/google-oauth-client-secret -- gitleaks:allow, BSM item reference, not a secret
