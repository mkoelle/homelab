---
apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: zitadel-gateway
  namespace: zitadel
spec:
  endpointSelector: {}
  ingress:
    # Gateway API proxy: Envoy-forwarded traffic carries the reserved
    # "ingress" identity, not a namespace-based pod identity (same pattern as
    # apps/core/authelia/cilium-networkpolicy.yaml). Port 3000 is the Login
    # UI (zitadel-login, see httproute via values.yaml's login.gateway.
    # httpRoute) -- without it, Envoy's traffic to that backend is silently
    # dropped and the Gateway returns 503, even though the pod itself is
    # healthy and reachable directly via its Service.
    - fromEntities:
        - "ingress"
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
            - port: "3000"
              protocol: TCP
    # ArgoCD/Grafana calling Zitadel's token/userinfo endpoints server-side
    # during the OIDC code exchange (not proxied through the Gateway).
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: core-argocd
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # OIDC relay (oidc-relay.yaml) -- no blanket same-namespace rule exists
    # here (unlike zitadel-policy's plain NetworkPolicy, which allows
    # `from: podSelector: {}`), so the relay needs its own explicit entry.
    - fromEndpoints:
        - matchLabels:
            app: zitadel-oidc-relay
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  egress:
    # kube-apiserver entity matches post-DNAT regardless of IP/port
    # (kubeProxyReplacement workaround, same as other apps in this repo).
    - toEntities:
        - "kube-apiserver"
    # Outbound to Google for the "Sign in with Google" IDP federation
    # (accounts.google.com, oauth2.googleapis.com) and Let's Encrypt/ACME.
    - toEntities:
        - "world"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
