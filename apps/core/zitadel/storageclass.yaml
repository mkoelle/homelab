---
# Static StorageClass for the pre-provisioned local PV below.
# WaitForFirstConsumer is required
# for `local` volumes -- binding must happen after the pod is scheduled, so
# the PVC binds to a PV on the same node.
#
# Postgres deliberately does NOT live on the shared SMB StorageClass
# (apps/core/storage/): SMB/CIFS doesn't reliably support Postgres's
# fsync/WAL locking semantics (see docs/adrs/0004-smb-storage-for-all-workloads.md).
# Backups are not implemented yet; add and test a Postgres dump to SMB before
# relying on this local PV for recovery. Tracked in docs/planning/backlog.md.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: zitadel-postgres-local
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Retain
