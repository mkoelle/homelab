---
# ExternalSecret -- pulls the scoped Route53 IAM user's access key for the
# letsencrypt-route53 ClusterIssuer's DNS-01 solver. Lands in ns cert-manager,
# NOT zitadel: cert-manager resolves every ClusterIssuer secretRef from its
# own --cluster-resource-namespace (default "cert-manager"), regardless of
# which app directory the YAML lives in.
#
# Before applying: create a dedicated IAM user (not reused from any
# aws-hyperbase-core/com.mkoelle role) scoped to exactly:
#   route53:GetChange on arn:aws:route53:::change/*
#   route53:ChangeResourceRecordSets, route53:ListResourceRecordSets on
#     arn:aws:route53:::hostedzone/<mkoelle.com zone ID>
# (zone ID via `aws route53 list-hosted-zones-by-name --dns-name mkoelle.com`)
# Generate an access key, add both halves as Bitwarden SM items, replace the
# UUIDs below.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: route53-dns01-secret
  namespace: cert-manager
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  target:
    name: route53-dns01-credentials
    creationPolicy: Owner
  data:
    - secretKey: access-key-id
      remoteRef:
        key: "65e1c7a2-2539-49cb-ab3b-b4cd0145cc69" # auth/zitadel/route53-access-key-id -- gitleaks:allow, BSM item reference, not a secret
    - secretKey: secret-access-key
      remoteRef:
        key: "f093ffe1-c09a-4322-aaab-b4cd0145edd7" # auth/zitadel/route53-secret-access-key -- gitleaks:allow, BSM item reference, not a secret
