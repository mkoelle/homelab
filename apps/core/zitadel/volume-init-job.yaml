---
# Create the host directory for volume.yaml's `local` PV before Postgres
# starts; local PVs cannot create their backing paths themselves.
apiVersion: batch/v1
kind: Job
metadata:
  name: zitadel-postgres-data-dir-init
  namespace: kube-system
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: OnFailure
      nodeSelector:
        kubernetes.io/hostname: motherbox
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: init
          image: busybox:1.36
          command:
            - sh
            - -c
            - mkdir -p /host/var/lib/kubelet/zitadel-postgres-data && chmod 0770 /host/var/lib/kubelet/zitadel-postgres-data
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: host-var-lib
              mountPath: /host/var/lib
      volumes:
        - name: host-var-lib
          hostPath:
            path: /var/lib
