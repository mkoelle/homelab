---
# Same public CA cert as apps/core/argocd/homelab-ca-configmap.yaml (public
# half only, safe to commit) -- but as a Secret, not a ConfigMap, because the
# zitadel chart's dbSslCaCrtSecret expects one (mounted at
# /db-ssl-ca-crt/ca.crt, key "ca.crt"). Needed so Zitadel's own Postgres
# client can verify the internal ca-issuer-signed cert on
# postgres-cert.yaml's Certificate (sslmode=verify-ca) -- unrelated to the
# public Let's Encrypt cert used for id.hl.mkoelle.com itself.
#
# Repo has no central trust-manager Bundle -- every consumer carries its own
# copy of this same CA (confirmed during planning). Update this file to match
# if the 10-year root is ever rotated.
apiVersion: v1
kind: Secret
metadata:
  name: zitadel-db-ca
  namespace: zitadel
type: Opaque
stringData:
  ca.crt: |
    -----BEGIN CERTIFICATE-----
