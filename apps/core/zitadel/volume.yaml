---
# `local` PV, not hostPath -- pod-security "restricted" forbids hostPath as a
# volume source (same issue and fix as apps/core/authelia/volume.yaml). Path
# nested under /var/lib/kubelet, not bare /var/lib -- kubelet's own
# local-volume stat check only reliably sees paths under its own state tree.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: zitadel-postgres-data
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: zitadel-postgres-local
  local:
    path: /var/lib/kubelet/zitadel-postgres-data
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - motherbox
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: zitadel-postgres-data
  namespace: zitadel
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: zitadel-postgres-local
  resources:
    requests:
      storage: 5Gi
