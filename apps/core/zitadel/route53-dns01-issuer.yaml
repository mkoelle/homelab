---
# Public trust for id.hl.mkoelle.com: Google's OAuth client console rejects
# redirect URIs on .local (RFC 6762 mDNS TLD fails Google's public-suffix
# check -- confirmed live). mkoelle.com is a real domain (Namecheap
# registrar, DNS hosted on AWS Route53), so cert-manager issues a real
# Let's Encrypt cert via ACME DNS-01 against that hosted zone instead of the
# internal self-signed ca-issuer used everywhere else in this cluster.
#
# DNS-01 only ever creates a transient _acme-challenge TXT record -- no A
# record is published, so id.hl.mkoelle.com stays unresolvable from the public
# internet (see apps/core/coredns-custom/configmap.yaml for the LAN-only
# override that makes it resolve internally).
#
# Placed in this app (wave 1), not apps/core/cert-manager/ (wave -2):
# route53-dns01-secret.yaml below is an ExternalSecret, and that CRD doesn't
# exist until external-secrets (wave -1) has synced. Putting this in
# cert-manager's own wave would fail with a missing-CRD error.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-route53
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: mkoelle@gmail.com
    privateKeySecretRef:
      name: letsencrypt-route53-account-key
    solvers:
      - dns01:
          route53:
            region: us-east-1
            hostedZoneID: Z0965292UA0UJK9EHF2X
            accessKeyIDSecretRef:
              name: route53-dns01-credentials
              key: access-key-id
            secretAccessKeySecretRef:
              name: route53-dns01-credentials
              key: secret-access-key
        selector:
          dnsZones:
            - mkoelle.com
