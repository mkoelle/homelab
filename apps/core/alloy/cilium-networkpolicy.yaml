---
# Gateway API traffic is forwarded by Cilium's Envoy under the reserved
# "ingress" identity, not the "gateway" namespace's own pod identity --
# same finding as apps/core/uptime-kuma/cilium-networkpolicy.yaml, a plain
# NetworkPolicy namespaceSelector rule can't match it.
apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: alloy-oauth2-proxy-gateway
  namespace: alloy
spec:
  endpointSelector:
    matchLabels:
      app: alloy-oauth2-proxy
  ingress:
    - fromEntities:
        - "ingress"
      toPorts:
        - ports:
            - port: "4180"
              protocol: TCP
