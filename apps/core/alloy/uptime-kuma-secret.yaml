---
# Uptime Kuma's /metrics endpoint uses HTTP Basic Auth: the Kuma username as
# the username, and an API token (Settings > API Keys, created inside its
# own UI after first login) as the password -- there is no way to
# provision this token declaratively ahead of time, it doesn't exist until
# a human creates it through the app itself. Same "placeholder value" state
# as every other ExternalSecret in this repo until populated for real (see
# CLAUDE.md Secrets Pattern) -- but this one specifically can't be
# pre-populated even in principle, only after Uptime Kuma's first login.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: uptime-kuma-metrics
  namespace: alloy
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  target:
    name: uptime-kuma-metrics
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: "e8e366b1-4f25-4bb0-8e43-b4cf0038f7fe"
    - secretKey: api-key
      remoteRef:
        key: "5c4f94a9-80f8-44de-b538-b4cf003816d7"
