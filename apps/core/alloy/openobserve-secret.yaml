---
# Same Bitwarden item as apps/core/openobserve/secret.yaml's ExternalSecret,
# materialized a second time here because a Secret volume mount can only
# reference a Secret in the *same* namespace as the pod (Alloy's DaemonSet
# runs in the alloy namespace, not openobserve) -- same "each consuming app
# gets its own ExternalSecret" pattern as every other secret in this repo
# (CLAUDE.md Secrets Pattern), deliberately not a cross-namespace RBAC grant
# for Alloy to read arbitrary Secrets cluster-wide.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openobserve-root
  namespace: alloy
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  target:
    name: openobserve-root
    creationPolicy: Owner
  data:
    - secretKey: ZO_ROOT_USER_EMAIL
      remoteRef:
        key: "3b537e08-311e-452e-9f67-e6a51bc65e05"
    - secretKey: ZO_ROOT_USER_PASSWORD
      remoteRef:
        key: "63881000-f556-4b4f-a394-aa2acd2943f0"
