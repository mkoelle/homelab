nameOverride: alloy-oauth2-proxy
fullnameOverride: alloy-oauth2-proxy

config:
  existingSecret: alloy-oauth2-proxy-secret
  upstreams:
    - http://alloy.alloy.svc.cluster.local:12345/

extraArgs:
  provider: oidc
  oidc-issuer-url: https://id.hl.mkoelle.com
  redirect-url: https://alloy.motherbox.local/oauth2/callback
  cookie-secure: "true"
  skip-provider-button: "true"

resources:
  requests:
    memory: "64Mi"
    cpu: "50m"
  limits:
    memory: "128Mi"
    cpu: "500m"

gatewayApi:
  enabled: true
  gatewayRef:
    name: homelab
    namespace: gateway
  hostnames:
    - alloy.motherbox.local

networkPolicy:
  create: false # this app's own networkpolicy.yaml/cilium-networkpolicy.yaml cover it
