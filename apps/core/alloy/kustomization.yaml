---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: alloy

resources:
  - namespace.yaml
  - rbac.yaml
  - uptime-kuma-secret.yaml

helmCharts:
  - name: alloy
    repo: https://grafana.github.io/helm-charts
    version: 1.12.1
    releaseName: alloy
    namespace: alloy
    includeCRDs: true
    valuesFile: values.yaml
