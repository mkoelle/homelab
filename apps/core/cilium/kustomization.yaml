---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - lb-ip-pool.yaml
  - l2-announcement-policy.yaml
  - kube-system-namespace-label.yaml
  - hubble-oauth2-proxy-networkpolicy.yaml

helmCharts:
  - name: cilium
    repo: https://helm.cilium.io/
    releaseName: cilium
    version: 1.20.2
    includeCRDs: true
    namespace: kube-system
    valuesFile: ./values.yaml
  # SSO front door for Hubble UI (hubble-oauth2-proxy-values.yaml) --
  # Hubble UI has no native OIDC support.
  - name: oauth2-proxy
    repo: https://oauth2-proxy.github.io/manifests
    version: 10.7.0
    releaseName: hubble-oauth2-proxy
    namespace: kube-system
    valuesFile: hubble-oauth2-proxy-values.yaml
