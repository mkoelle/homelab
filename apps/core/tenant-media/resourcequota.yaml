---
# Sized for Jellyfin + Sonarr/Radarr/Lidarr plus Immich (server,
# machine-learning, its own Postgres and Redis -- see
# mkoelle/homelab-media's apps/servers/immich). Node has 8 CPU / ~31Gi
# (`kubectl describe node`, confirmed live); cluster-wide requests sat at
# ~50% cpu / ~27% mem before this bump, so there's real headroom. Bumped
# requests/limits and the PVC budget together: Immich adds 3 local-path
# PVCs of its own (Postgres data, ML model cache, library/thumbnails --
# originals stay on the read-only NAS import, see smb-photos-creds.yaml).
#
# limits.cpu/limits.memory bumped a second time (12->18, 14Gi->20Gi):
# confirmed live that the first bump (12/14Gi) still wasn't enough --
# jellyfin/sonarr/radarr/lidarr's own container limits already summed to
# ~7.8 CPU / ~7.6Gi before Immich existed, and Immich's four containers'
# limits sum to another ~4.7 CPU / ~7.5Gi, so the ceiling needed real
# headroom on top of both. limits are just a ceiling, not a reservation --
# this cluster already runs at ~320% cpu overcommit on limits cluster-wide
# (confirmed live via `kubectl describe node`), so this isn't a real
# capacity risk; requests (the actual scheduling reservation) stay
# untouched and were nowhere near their own cap.
# services.loadbalancers: "0" keeps the tenant from claiming LAN IPs out of
# the Cilium LB pool -- media is exposed only via the shared Gateway.
#
# Storage: the tenant self-provisions node-local PVCs from `local-path`
# (apps/core/local-path) -- capped here, since local-path doesn't enforce
# sizes on disk (it's a directory on motherbox's SSD). Every other
# StorageClass is zeroed so a tenant claim can never bind a homelab volume
# (photos-pv, zitadel-postgres-local) should one ever become Released.
# Add a line here for any new StorageClass.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: media-quota
  namespace: media
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "18"
    limits.memory: 20Gi
    pods: "20"
    services.loadbalancers: "0"
    services.nodeports: "0"
    persistentvolumeclaims: "9"
    local-path.storageclass.storage.k8s.io/persistentvolumeclaims: "9"
    local-path.storageclass.storage.k8s.io/requests.storage: 120Gi
    photos-pv.storageclass.storage.k8s.io/persistentvolumeclaims: "0"
    zitadel-postgres-local.storageclass.storage.k8s.io/persistentvolumeclaims: "0"
---
# No pods in media-argocd, ever.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: media-argocd-quota
  namespace: media-argocd
spec:
  hard:
    pods: "0"
    persistentvolumeclaims: "0"
    services.loadbalancers: "0"
    services.nodeports: "0"
