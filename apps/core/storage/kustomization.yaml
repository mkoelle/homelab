---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - storageclass.yaml
  - namespace.yaml
  - volumes.yaml
  - storageclass-smb-static.yaml
  - volumes-media.yaml
  - storageclass-media-local.yaml
  - volumes-media-local.yaml
  - volumes-media-local-init-job.yaml

helmCharts:
  - name: csi-driver-smb
    repo: https://raw.githubusercontent.com/kubernetes-csi/csi-driver-smb/master/charts
    version: 1.20.3
    releaseName: csi-driver-smb
    # The driver itself is typically installed in kube-system
    namespace: kube-system
    includeCRDs: true
    # valuesInline kept minimal; PV source uses IP to avoid DNS dependency
