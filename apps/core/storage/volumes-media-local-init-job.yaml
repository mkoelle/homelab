---
# One-time host-directory creation for volumes-media-local.yaml's `local`
# PVs -- same pattern as apps/core/zitadel/volume-init-job.yaml. Runs in
# kube-system (homelab's side of the fence), never in the tenant namespace.
# mkdir -p is idempotent, so re-running on every sync is harmless. Ownership
# is left to the consuming pod's fsGroup (kubelet applies it to `local`
# volumes) -- this container drops ALL caps, so it couldn't chown anyway.
# PreSync hook is fine here: it depends on nothing inside the storage app.
apiVersion: batch/v1
kind: Job
metadata:
  name: media-local-dirs-init
  namespace: kube-system
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: OnFailure
      nodeSelector:
        kubernetes.io/hostname: motherbox
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: init
          image: busybox:1.36
          command:
            - sh
            - -c
            - mkdir -p /host/var/lib/kubelet/media-jellyfin-config && chmod 0770 /host/var/lib/kubelet/media-jellyfin-config
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: host-var-lib-kubelet
              mountPath: /host/var/lib/kubelet
      volumes:
        - name: host-var-lib-kubelet
          hostPath:
            path: /var/lib/kubelet
