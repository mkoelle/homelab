# Synology CSI Driver Helm Values
# Configuration for multiple SMB shares with different credentials on asgard.local

# DSM API connection information (for CSI controller)
# This user needs ADMIN privileges to manage storage resources
clientInfoSecret:
  create: true
  name: "client-info-secret"
  clients:
    - host: asgard.local
      port: 5000          # Use 5001 if using HTTPS
      https: false        # Set to true if using HTTPS
      username: bort      # Admin user for API access
      password: foobar

# Storage Classes configuration
# Each storage class can use different SMB credentials
storageClasses:
  # Pictures share with user1 credentials
  smb-pictures:
    name: "synology-smb-pictures"
    provisioner: "csi.san.synology.com"
    reclaimPolicy: "Retain"
    allowVolumeExpansion: true
    isDefaultClass: false
    parameters:
      protocol: "smb"
      dsm: "asgard.local"
      location: "/volume1"
      # References pictures-specific credentials
      csi.storage.k8s.io/node-stage-secret-name: "smb-pictures-credentials"
      csi.storage.k8s.io/node-stage-secret-namespace: "synology-csi"

  # Documents share with user2 credentials
  smb-documents:
    name: "synology-smb-documents"
    provisioner: "csi.san.synology.com"
    reclaimPolicy: "Retain"
    allowVolumeExpansion: true
    isDefaultClass: false
    parameters:
      protocol: "smb"
      dsm: "asgard.local"
      location: "/volume1"
      # References documents-specific credentials
      csi.storage.k8s.io/node-stage-secret-name: "smb-documents-credentials"
      csi.storage.k8s.io/node-stage-secret-namespace: "synology-csi"

  # Media share with user3 credentials
  smb-media:
    name: "synology-smb-media"
    provisioner: "csi.san.synology.com"
    reclaimPolicy: "Delete"
    allowVolumeExpansion: true
    isDefaultClass: false
    parameters:
      protocol: "smb"
      dsm: "asgard.local"
      location: "/volume1"
      # References media-specific credentials
      csi.storage.k8s.io/node-stage-secret-name: "smb-media-credentials"
      csi.storage.k8s.io/node-stage-secret-namespace: "synology-csi"

# Controller configuration
controller:
  enabled: true
  replicas: 1

# Node configuration
node:
  enabled: true
  kubeletPath: "/var/lib/kubelet"

# Snapshotter (optional)
snapshotter:
  enabled: true

# Volume Snapshot Classes (optional)
volumeSnapshotClasses:
  synology-snapshot:
    name: "synology-snapshotclass"
    driver: "csi.san.synology.com"
    deletionPolicy: "Delete"
    isDefaultClass: false
    parameters:
      description: "Kubernetes CSI Snapshot"
      is_locked: "false"

# =========================================================================
# IMPORTANT: Create separate credential secrets for each share
# =========================================================================
# Run these commands BEFORE installing the Helm chart:
#
# kubectl create namespace synology-csi
#
# # Pictures share credentials
# kubectl create secret generic smb-pictures-credentials \
#   --namespace synology-csi \
#   --from-literal=username=pictureuser \
#   --from-literal=password=picturepass123
#
# # Documents share credentials  
# kubectl create secret generic smb-documents-credentials \
#   --namespace synology-csi \
#   --from-literal=username=docuser \
#   --from-literal=password=docpass456
#
# # Media share credentials
# kubectl create secret generic smb-media-credentials \
#   --namespace synology-csi \
#   --from-literal=username=mediauser \
#   --from-literal=password=mediapass789
#
# =========================================================================
# Usage Example:
# =========================================================================
# Create PVCs that reference different storage classes:
#
# apiVersion: v1
# kind: PersistentVolumeClaim
# metadata:
#   name: pictures-pvc
# spec:
#   accessModes:
#     - ReadWriteMany
#   storageClassName: synology-smb-pictures  # Uses pictureuser credentials
#   resources:
#     requests:
#       storage: 10Gi
# ---
# apiVersion: v1
# kind: PersistentVolumeClaim
# metadata:
#   name: documents-pvc
# spec:
#   accessModes:
#     - ReadWriteMany
#   storageClassName: synology-smb-documents  # Uses docuser credentials
#   resources:
#     requests:
#       storage: 20Gi