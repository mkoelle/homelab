---
# NAS volumes for the homelab-media tenant (ADR 0008). PVs are cluster-scoped
# and a PV can point anywhere (incl. hostPath), so they're part of homelab's
# fence -- the tenant repo only creates the matching PVCs. Each PV is pinned
# with claimRef to exactly one claim in namespace media, so no other claim
# (or namespace) can bind it.
#
# Credentials: NAS user dedicated to media, read-only on the library shares
# -- see smb-media-creds in apps/core/external-secrets. The tenant has no
# NAS write access yet (a later feature); app state lives on node-local PVs
# instead (volumes-media-local.yaml). Library PVs are additionally mounted read-only
# at the CSI layer (csi.readOnly), so a misconfigured app can't modify
# libraries even if NAS permissions drift.
#
# Mount options: uid/gid 1000 = the non-root user the media pods run as
# (CIFS ignores fsGroup, ownership comes from the mount).
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: media-anime
spec:
  capacity:
    storage: 10Ti # Nominal; SMB doesn't enforce it. Claim must request <= this.
  accessModes:
    - ReadOnlyMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: smb-static
  claimRef:
    namespace: media
    name: jellyfin-anime
  mountOptions:
    - uid=1000
    - gid=1000
    - dir_mode=0555
    - file_mode=0444
  csi:
    driver: smb.csi.k8s.io
    volumeHandle: media-anime
    readOnly: true
    volumeAttributes:
      source: "//192.168.1.10/Anime"
    nodeStageSecretRef:
      name: smb-media-creds
      namespace: core-secrets
