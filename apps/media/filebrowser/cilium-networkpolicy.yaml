---
apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: filebrowser-gateway
  namespace: filebrowser
spec:
  endpointSelector:
    matchLabels:
      app: filebrowser
  ingress:
    # Gateway API proxy: traffic forwarded by Cilium's Envoy carries the
    # reserved "ingress" identity, not the "gateway" namespace's pod identity
    # (envoy runs host-networked in kube-system) -- confirmed via
    # `cilium-dbg monitor` policy-verdict logs, "remote ID ingress ... deny".
    - fromEntities:
        - "ingress"
