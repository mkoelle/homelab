---
apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: filebrowser-gateway
  namespace: filebrowser
spec:
  endpointSelector:
    matchLabels:
      app: filebrowser
  ingress:
    # Gateway API proxy: Cilium envoy pods in gateway namespace
    - fromEndpoints:
        - matchNamespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gateway
