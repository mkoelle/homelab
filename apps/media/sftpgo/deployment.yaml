---
# Replaces filebrowser: same read-only web browsing of the NAS photo share,
# same photos-pv static PV, same LAN-only exposure -- SFTPGo's WebClient UI
# instead of hurlenko/filebrowser's. sftpd and the web-admin UI are both
# disabled (env overrides below); only the WebClient binding is exposed.
#
# Non-root out of the box: the image's own Dockerfile creates uid/gid 1000
# ("sftpgo") and its final USER is 1000:1000, no root entrypoint/chown step
# -- confirmed against the v2.7.6 Dockerfile, not a guess (unlike the first
# pass at Immich's images, which cost a debugging cycle).
#
# Login is SSO-only via Zitadel OIDC. The OIDC client Secret comes from
# homelab's zitadel/terraform/main.tf (kubernetes_secret.sftpgo_oidc).
# Accounts come from a loaddata file (configmap.yaml) that an initContainer
# renders into a shared emptyDir before the main container starts.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sftpgo
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: sftpgo
  template:
    metadata:
      labels:
        app: sftpgo
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      # Pin id.hl.mkoelle.com to the Zitadel OIDC relay's static ClusterIP
      # (apps/core/zitadel/oidc-relay.yaml), same as argocd-server's
      # patch-argocd-server-hostalias.yaml: the Gateway VIP CoreDNS returns
      # hairpins through Cilium's Envoy and is denied for in-cluster callers.
      hostAliases:
        - ip: 10.96.111.111
          hostnames:
            - id.hl.mkoelle.com
      initContainers:
        - name: render-loaddata
          image: docker.io/library/busybox:1.37.0@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
          command:
            - sh
            - -c
            # Fresh random hex per placeholder password, every start (hex, so
            # it is sed-safe). Nothing can use them -- see configmap.yaml.
            - |
              awk '{
                while (index($0, "__RANDOM_PASSWORD__")) {
                  cmd = "head -c 32 /dev/urandom | od -An -tx1 | tr -d \" \\n\""
                  cmd | getline pw; close(cmd)
                  sub(/__RANDOM_PASSWORD__/, pw)
                }
                print
              }' /template/loaddata.json.tmpl > /loaddata/loaddata.json
          volumeMounts:
            - name: loaddata-template
              mountPath: /template
            - name: loaddata-rendered
              mountPath: /loaddata
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
      containers:
        - name: sftpgo
          image: ghcr.io/drakkan/sftpgo:v2.7.6@sha256:1edd28d80de2a008863fbfc58c8ff7db47b1b410bae48d4e6076192337809b11
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            # Disable sftpd entirely -- WebClient only, like filebrowser.
            - name: SFTPGO_SFTPD__BINDINGS__0__PORT
              value: "0"
            # Web-admin UI and REST API stay off, so the placeholder admin
            # (configmap.yaml) has no interface to log in through -- the
            # LAN-only NetworkPolicy is this app's only real boundary. The
            # WebClient doesn't use the REST API (verified against v2.7.6:
            # viewer login + directory listing work with it disabled).
            - name: SFTPGO_HTTPD__BINDINGS__0__ENABLE_WEB_ADMIN
              value: "false"
            - name: SFTPGO_HTTPD__BINDINGS__0__ENABLE_REST_API
              value: "false"
            # SSO only: bit 8 disables the WebClient login form (verified
            # against v2.7.6 -- form gone, password POST 405, OIDC link kept).
            - name: SFTPGO_HTTPD__BINDINGS__0__DISABLED_LOGIN_METHODS
              value: "8"
            # Zitadel OIDC. id.hl.mkoelle.com resolves to the OIDC relay via
            # hostAliases below, not the Gateway VIP (hairpin denial -- see
            # apps/core/zitadel/oidc-relay.yaml). preferred_username is the
            # user's email for Google-federated Zitadel users.
            - name: SFTPGO_HTTPD__BINDINGS__0__OIDC__CONFIG_URL
              value: https://id.hl.mkoelle.com
            - name: SFTPGO_HTTPD__BINDINGS__0__OIDC__REDIRECT_BASE_URL
              value: https://sftpgo.hl.mkoelle.com
            - name: SFTPGO_HTTPD__BINDINGS__0__OIDC__USERNAME_FIELD
              value: preferred_username
            - name: SFTPGO_HTTPD__BINDINGS__0__OIDC__CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: zitadel-sftpgo-oidc-secret
                  key: client-id
            - name: SFTPGO_HTTPD__BINDINGS__0__OIDC__CLIENT_SECRET_FILE
              value: /etc/sftpgo-oidc/client-secret
            - name: SFTPGO_HTTPD__BINDINGS__0__ENABLE_WEB_CLIENT
              value: "true"
            - name: SFTPGO_DATA_PROVIDER__DRIVER
              value: bolt
            - name: SFTPGO_DATA_PROVIDER__NAME
              value: /var/lib/sftpgo/sftpgo.db
            - name: SFTPGO_LOADDATA_FROM
              value: /loaddata/loaddata.json
            # Add-or-update on every start: reconciles the one user from the
            # Secret each time, rather than only on an empty data provider.
            - name: SFTPGO_LOADDATA_MODE
              value: "0"
          volumeMounts:
            - name: data
              mountPath: /var/lib/sftpgo
            - name: photos
              mountPath: /srv/sftpgo/data/photos
              readOnly: true
            - name: loaddata-rendered
              mountPath: /loaddata
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: oidc-secret
              mountPath: /etc/sftpgo-oidc
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: sftpgo-data
        - name: photos
          persistentVolumeClaim:
            claimName: pvc-photos-ro
        - name: loaddata-template
          configMap:
            name: sftpgo-loaddata-template
        - name: loaddata-rendered
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: oidc-secret
          secret:
            secretName: zitadel-sftpgo-oidc-secret
            items:
              - key: client-secret
                path: client-secret
