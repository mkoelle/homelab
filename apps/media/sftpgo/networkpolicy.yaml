---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sftpgo-policy
  namespace: sftpgo
spec:
  podSelector:
    matchLabels:
      app: sftpgo
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # LAN access only
    - from:
        - ipBlock:
            cidr: 192.168.1.0/24
      ports:
        - protocol: TCP
          port: 8080
    # Gateway API proxy: envoy pods run in cluster CIDR, not LAN
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gateway
      ports:
        - protocol: TCP
          port: 8080
  egress:
    # DNS
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # NAS (SMB)
    - to:
        - ipBlock:
            cidr: 192.168.1.10/32
      ports:
        - protocol: TCP
          port: 445
    # Zitadel OIDC relay (discovery, token exchange, JWKS) -- see the
    # hostAliases comment in deployment.yaml. Pod selector, not the
    # ClusterIP: kube-proxy-replacement rewrites the destination to the
    # relay pod IP before egress policy runs (apps/core/argocd/networkpolicy.yaml).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: zitadel
          podSelector:
            matchLabels:
              app: zitadel-oidc-relay
      ports:
        - protocol: TCP
          port: 8443
