---
# Declarative user provisioning (SFTPGo's "loaddata" feature) instead of the
# web-admin UI -- the password placeholder is substituted by an initContainer
# (deployment.yaml) from the Terraform-generated Secret before SFTPGo starts,
# since loaddata needs the real value baked into the file, not an env-var
# reference. "/" is the required fallback permission key (not "*"); listing
# only list+download makes this user strictly read-only -- no upload,
# delete, rename, or overwrite. home_dir matches the image's own default
# users_base_dir (/srv/sftpgo/data, baked into /etc/sftpgo/sftpgo.json) plus
# the photos-pv mount subpath below.
#
# The "admins" entry is a placeholder that is never used: SFTPGo sends every
# WebClient login to /web/admin/setup while no admin exists, even with the
# web admin disabled -- so "/" rendered an empty page and the login form was
# unreachable (verified against v2.7.6). Its password is random per start
# (deployment.yaml initContainer), and with web admin + REST API both off
# there is nowhere to use it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: sftpgo-loaddata-template
  namespace: sftpgo
data:
  loaddata.json.tmpl: |
    {
      "admins": [
        {
          "username": "setup-placeholder",
          "status": 1,
          "password": "__SFTPGO_ADMIN_PASSWORD__",
          "permissions": ["*"]
        }
      ],
      "users": [
        {
          "username": "viewer",
          "status": 1,
          "password": "__SFTPGO_VIEWER_PASSWORD__",
          "home_dir": "/srv/sftpgo/data/photos",
          "permissions": { "/": ["list", "download"] }
        }
      ]
    }
