---
# SMB-backed PersistentVolume using Synology CSI driver
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-photos-ro
spec:
  capacity:
    storage: 1Ti
  accessModes:
    - ReadOnlyMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: synology-photos-ro
  csi:
    driver: csi.san.synology.com
    volumeHandle: photoprism-photos-smb-ro
    volumeAttributes:
      protocol: smb
      dsm: "192.168.1.10"
      location: /volume1
      source: //192.168.1.10/photos
    nodeStageSecretRef:
      name: synology-smb-credentials
      namespace: photoprism
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-photos-ro
spec:
  accessModes:
    - ReadOnlyMany
  storageClassName: synology-photos-ro
  resources:
    requests:
      storage: 1Ti
