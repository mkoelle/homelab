apiVersion: apps/v1
kind: Deployment
metadata:
  name: photoprism
  namespace: photoprism
spec:
  selector:
    matchLabels:
      app: photoprism
  template:
    metadata:
      labels:
        app: photoprism
    spec:
      containers:
      - name: photoprism
        image: photoprism/photoprism:latest
        ports:
        - containerPort: 2342
          name: http
        env:
        - name: PHOTOPRISM_HTTP_PORT
          value: "2342"
        - name: PHOTOPRISM_AUTH_MODE
          value: "password"
        # Admin password should probably be a secret, but setting a default for now or leaving it to the user
        - name: PHOTOPRISM_ADMIN_PASSWORD
          value: "admin"
        volumeMounts:
        - name: originals
          mountPath: /photoprism/originals
        - name: storage
          mountPath: /photoprism/storage
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
      volumes:
      - name: originals
        persistentVolumeClaim:
          claimName: pvc-photos-ro
      - name: storage
        emptyDir: {} # Temporary storage if not persistent, or could add a PVC later