---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: photoprism

resources:
  - namespace.yaml
  - pvc-photos.yaml

helmCharts:
  - name: photoprism
    repo: https://charts.photoprism.app/photoprism
    releaseName: photoprism/photoprism-plus
    includeCRDs: true
    namespace: photoprism
    valuesFile: ./values.yaml
