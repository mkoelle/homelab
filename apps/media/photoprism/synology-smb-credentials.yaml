---
# Secret for SMB authentication to Synology NAS
# This secret is required for the Synology CSI driver to mount SMB shares
apiVersion: v1
kind: Secret
metadata:
  name: synology-smb-credentials
  namespace: photoprism
type: Opaque
stringData:
  username: pod-photos
  password: Not-th3-real-password  # TODO: Replace with actual password or use secretGenerator
